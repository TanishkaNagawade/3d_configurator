<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ENGINEERING CONFIGURATOR PAGE DESIGNER</title>
<link href="vendor/fonts/fonts.css" rel="stylesheet">
<style>
:root{
  --bg:#0a0e14; --panel:#0f151e; --panel2:#131b26; --panel3:#182231;
  --line:#1e2a3a; --line2:#26364a;
  --txt:#c8d6e5; --dim:#6b7f96; --dim2:#48596c;
  --cyan:#22d3ee; --cyan-d:#0e7490; --amber:#f59e0b; --orange:#fb923c;
  --green:#34d399; --red:#f43f5e; --violet:#a78bfa;
  --sel:rgba(34,211,238,.14); --selb:rgba(34,211,238,.55);
  --h-menu:26px; --h-ribbon:84px; --h-status:22px;
  --f-ui:'Rajdhani',system-ui,sans-serif; --f-mono:'JetBrains Mono',monospace;
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden}
body{background:var(--bg);color:var(--txt);font-family:var(--f-ui);font-size:13px;font-weight:500;
  letter-spacing:.2px;user-select:none;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font-family:inherit;font-size:inherit;color:inherit;outline:none}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-track{background:#0b1017}
::-webkit-scrollbar-thumb{background:#233247;border:2px solid #0b1017;border-radius:5px}
::-webkit-scrollbar-thumb:hover{background:#2f455f}

/* ============ APP GRID ============ */
#app{display:grid;grid-template-rows:var(--h-menu) var(--h-ribbon) 1fr var(--h-status);height:100%}

/* ============ MENUBAR ============ */
#menubar{display:flex;align-items:stretch;background:linear-gradient(#121a25,#0d141d);
  border-bottom:1px solid var(--line);position:relative;z-index:600}
.brand{display:flex;align-items:center;gap:7px;padding:0 12px 0 10px;border-right:1px solid var(--line)}
.brand .dot{width:7px;height:7px;background:var(--cyan);box-shadow:0 0 8px var(--cyan);transform:rotate(45deg)}
.brand b{font-size:12px;letter-spacing:1.6px;color:#eaf4ff;font-weight:700}
.brand span{font-family:var(--f-mono);font-size:9px;color:var(--amber);letter-spacing:.5px}
.mi{display:flex;align-items:center;padding:0 9px;font-size:12.5px;color:#a9bccf;cursor:default;position:relative}
.mi:hover,.mi.open{background:var(--panel3);color:#fff}
.menu-pop{position:absolute;top:100%;left:0;min-width:222px;background:#131b26;border:1px solid var(--line2);
  box-shadow:0 18px 40px rgba(0,0,0,.6);padding:4px;display:none;z-index:700}
.mi.open .menu-pop{display:block}
.mrow{display:flex;justify-content:space-between;gap:16px;padding:4px 9px;font-size:12.5px;color:#b9cadd;cursor:pointer;white-space:nowrap}
.mrow:hover{background:var(--sel);color:#fff}
.mrow kbd{font-family:var(--f-mono);font-size:9.5px;color:var(--dim2)}
.msep{height:1px;background:var(--line);margin:4px 6px}
.mhead{padding:5px 9px 3px;font-family:var(--f-mono);font-size:9px;letter-spacing:1.4px;color:var(--dim2)}

/* ============ RIBBON ============ */
#ribbon{display:flex;background:linear-gradient(#0f151e,#0c1219);border-bottom:1px solid var(--line);overflow-x:auto;overflow-y:hidden}
#ribbon::-webkit-scrollbar{height:5px}
.rtabs{display:flex;flex-direction:column;justify-content:flex-start;border-right:1px solid var(--line);background:#0b1017;flex:0 0 auto}
.rtab{padding:3px 12px;font-size:11px;letter-spacing:1px;color:var(--dim);cursor:pointer;border-left:2px solid transparent}
.rtab.on{color:var(--cyan);border-left-color:var(--cyan);background:var(--panel2)}
.rgroup{display:flex;flex-direction:column;padding:3px 7px 0;border-right:1px solid var(--line);flex:0 0 auto}
.rgroup .rgt{margin-top:auto;text-align:center;font-family:var(--f-mono);font-size:8.5px;letter-spacing:1.3px;color:var(--dim2);padding-top:3px}
.rrow{display:flex;gap:2px;align-items:flex-start}
.rbtn{display:flex;flex-direction:column;align-items:center;gap:2px;min-width:46px;padding:4px 5px;
  border:1px solid transparent;cursor:pointer;color:#b3c5d8;border-radius:2px}
.rbtn:hover{background:var(--panel3);border-color:var(--line2);color:#fff}
.rbtn.on{background:var(--sel);border-color:var(--selb);color:var(--cyan)}
.rbtn svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
.rbtn span{font-size:10px;line-height:1.05;text-align:center;letter-spacing:.2px;max-width:60px}
.rbtn.sm{flex-direction:row;min-width:0;gap:5px;padding:3px 6px}
.rbtn.sm svg{width:14px;height:14px}
.rbtn.sm span{font-size:11px;max-width:none}
.rcol{display:flex;flex-direction:column;gap:1px}

/* ============ WORKSPACE ============ */
#ws{display:flex;min-height:0;background:#070a0f}
.dock{display:flex;flex-direction:column;background:var(--panel);border-right:1px solid var(--line);min-width:0}
#dockL{flex:0 0 268px}
#dockR{flex:0 0 306px;border-right:none;border-left:1px solid var(--line)}
#center{flex:1 1 auto;display:flex;flex-direction:column;min-width:0;min-height:0}
#dockB{flex:0 0 208px;background:var(--panel);border-top:1px solid var(--line);display:flex;flex-direction:column;min-height:0}
.splitter{flex:0 0 4px;background:#0a0f16;cursor:col-resize;position:relative}
.splitter:hover{background:var(--cyan-d)}
.splitter.h{cursor:row-resize;height:4px;width:auto;flex:0 0 4px}
.dock.collapsed{flex-basis:30px!important}
.dock.collapsed .ptabs .pt span,.dock.collapsed .pbody{display:none}

.ptabs{display:flex;align-items:stretch;background:#0b1017;border-bottom:1px solid var(--line);min-height:25px;overflow-x:auto}
.ptabs::-webkit-scrollbar{height:0}
.pt{display:flex;align-items:center;gap:5px;padding:0 10px;font-size:11px;letter-spacing:.8px;color:var(--dim);
  cursor:pointer;border-bottom:2px solid transparent;white-space:nowrap}
.pt.on{color:var(--cyan);border-bottom-color:var(--cyan);background:var(--panel2)}
.pt:hover{color:#dff}
.ptools{margin-left:auto;display:flex;align-items:center;gap:2px;padding:0 4px}
.ptool{width:18px;height:18px;display:grid;place-items:center;color:var(--dim);cursor:pointer;border-radius:2px}
.ptool:hover{background:var(--panel3);color:var(--cyan)}
.ptool svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.6}
.pbody{flex:1;overflow:auto;min-height:0}
.pane{display:none;height:100%;flex-direction:column}
.pane.on{display:flex}

/* ============ VIEWPORT ============ */
#vpwrap{flex:1;position:relative;min-height:0;background:#05080c;overflow:hidden}
#vp{position:absolute;inset:0}
#vp canvas.gl-fallback{position:absolute;inset:0;width:100%;height:100%;pointer-events:auto}
#vp .gl-err{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);z-index:6;
  display:flex;flex-direction:column;gap:6px;max-width:380px;padding:14px 18px;text-align:center;
  background:rgba(15,21,30,.92);border:1px solid var(--line2);color:var(--txt)}
#vp .gl-err b{font-family:var(--f-mono);font-size:12px;letter-spacing:2px;color:var(--amber)}
#vp .gl-err span{font-size:12px;color:var(--dim);line-height:1.5}
#vp canvas{display:block;width:100%;height:100%}
#labels{position:absolute;inset:0;pointer-events:none;overflow:hidden}
.vp-ovl{position:absolute;pointer-events:none;font-family:var(--f-mono);font-size:10px;color:#7d93aa;letter-spacing:.5px}
#vpTL{top:8px;left:10px;line-height:1.6}
#vpTL b{color:var(--cyan);font-weight:500}
#vpBL{bottom:8px;left:10px;line-height:1.6}
#vpBR{bottom:8px;right:10px;text-align:right;line-height:1.6}
.wmk{position:absolute;bottom:8px;left:50%;transform:translateX(-50%);font-family:var(--f-mono);font-size:9px;
  color:#3c4a5c;letter-spacing:2px;pointer-events:none;z-index:5}
#viewcube{position:absolute;top:10px;right:10px;width:96px;height:96px;z-index:6}
#viewcube canvas{width:96px;height:96px;cursor:pointer}
#accBar{position:absolute;top:112px;right:10px;width:96px;height:3px;background:#12202c;z-index:6}
#accBar i{display:block;height:100%;background:linear-gradient(90deg,var(--cyan),var(--amber));width:0%}
.vp-toolbar{position:absolute;top:8px;left:50%;transform:translateX(-50%);display:flex;gap:1px;
  background:rgba(11,16,23,.9);border:1px solid var(--line2);padding:2px;z-index:7;backdrop-filter:blur(6px)}
.vtb{width:27px;height:24px;display:grid;place-items:center;color:#95a9bd;cursor:pointer;border-radius:2px}
.vtb:hover{background:var(--panel3);color:#fff}
.vtb.on{background:var(--sel);color:var(--cyan)}
.vtb svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:1.5;stroke-linecap:round;stroke-linejoin:round}
#hud{position:absolute;right:10px;top:120px;width:186px;background:rgba(11,16,23,.88);border:1px solid var(--line2);
  padding:7px 8px;z-index:6;font-family:var(--f-mono);font-size:10px;line-height:1.75;backdrop-filter:blur(6px)}
#hud .hr{display:flex;justify-content:space-between;color:#8ba0b6}
#hud .hr b{color:var(--amber);font-weight:500}
#hud .ht{color:var(--cyan);letter-spacing:1.2px;font-size:9px;margin-bottom:2px}

/* ============ TREE ============ */
.tree{padding:3px 0;font-size:12.5px}
.tn{display:flex;align-items:center;gap:4px;padding:1px 6px 1px 0;white-space:nowrap;cursor:pointer;position:relative}
.tn:hover{background:#16202c}
.tn.sel{background:var(--sel);box-shadow:inset 2px 0 0 var(--cyan)}
.tn .tw{width:13px;height:13px;display:grid;place-items:center;color:var(--dim);flex:0 0 13px}
.tn .tw svg{width:9px;height:9px;stroke:currentColor;fill:none;stroke-width:2}
.tn .ti{width:14px;flex:0 0 14px;display:grid;place-items:center;color:var(--cyan);opacity:.85}
.tn .ti svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.tn .tl{flex:1;overflow:hidden;text-overflow:ellipsis;color:#bccfe2}
.tn.hid .tl{color:var(--dim2);text-decoration:line-through}
.tn .teye{opacity:0;width:16px;color:var(--dim);flex:0 0 16px}
.tn:hover .teye,.tn.hid .teye{opacity:1}
.tn .teye svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5}
.tn .tag{font-family:var(--f-mono);font-size:8.5px;color:var(--dim2);letter-spacing:.5px}
.tkids{display:block}
.tkids.hide{display:none}

/* ============ PROPERTY GRID ============ */
.pg{padding:0 0 10px}
.pgh{display:flex;align-items:center;gap:6px;padding:4px 8px;background:#0d141d;border-top:1px solid var(--line);
  border-bottom:1px solid var(--line);font-family:var(--f-mono);font-size:9px;letter-spacing:1.4px;color:var(--amber);
  position:sticky;top:0;z-index:2;cursor:pointer}
.pgh .cx{margin-left:auto;color:var(--dim2)}
.row{display:grid;grid-template-columns:104px 1fr;gap:6px;align-items:center;padding:2px 8px 2px 10px;min-height:22px}
.row>label{font-size:12px;color:#8ea3b8;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.row.wide{grid-template-columns:1fr}
.ctl,input[type=text],input[type=number],select,textarea{background:#0a1017;border:1px solid var(--line2);color:#dceaf7;
  padding:2px 6px;font-family:var(--f-mono);font-size:11px;width:100%;min-height:21px;border-radius:2px}
.ctl:focus,input:focus,select:focus,textarea:focus{border-color:var(--cyan);box-shadow:0 0 0 1px rgba(34,211,238,.25)}
select{cursor:pointer}
textarea{resize:vertical;line-height:1.5;font-family:var(--f-ui);font-size:12px}
input[type=range]{-webkit-appearance:none;appearance:none;background:transparent;width:100%;height:16px;padding:0;border:none;min-height:0}
input[type=range]::-webkit-slider-runnable-track{height:3px;background:#1c2a3a;border-radius:2px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:11px;height:11px;background:var(--cyan);
  border-radius:50%;margin-top:-4px;box-shadow:0 0 6px rgba(34,211,238,.7);cursor:pointer}
input[type=range]::-moz-range-track{height:3px;background:#1c2a3a}
input[type=range]::-moz-range-thumb{width:11px;height:11px;border:none;background:var(--cyan);border-radius:50%}
input[type=color]{padding:0;height:21px;border:1px solid var(--line2);background:#0a1017;cursor:pointer}
input[type=checkbox]{accent-color:var(--cyan);width:13px;height:13px;cursor:pointer;min-height:0}
.val{font-family:var(--f-mono);font-size:10.5px;color:var(--amber);text-align:right}
.btn{background:#16202c;border:1px solid var(--line2);color:#c5d7e8;padding:4px 9px;cursor:pointer;
  font-size:12px;letter-spacing:.5px;border-radius:2px;display:inline-flex;align-items:center;gap:5px;justify-content:center}
.btn:hover{background:#1e2b3b;border-color:var(--cyan-d);color:#fff}
.btn.pri{background:linear-gradient(#0e7490,#0b5c73);border-color:#22d3ee55;color:#e8fbff}
.btn.pri:hover{background:linear-gradient(#1197b8,#0e7490)}
.btn.amb{background:#3a2a08;border-color:#f59e0b55;color:#fcd9a0}
.btn.dgr{background:#3a1220;border-color:#f43f5e44;color:#ffc7d2}
.btn.on{background:var(--sel);border-color:var(--selb);color:var(--cyan)}
.btn svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:1.6}
.btnrow{display:flex;gap:4px;padding:5px 8px;flex-wrap:wrap}
.btnrow .btn{flex:1 1 auto}
.hint{padding:4px 10px;font-size:11.5px;color:var(--dim);line-height:1.45}
.empty{padding:22px 14px;text-align:center;color:var(--dim2);font-size:12px;line-height:1.6}
.chipbar{display:flex;flex-wrap:wrap;gap:3px;padding:5px 8px}
.chip{font-family:var(--f-mono);font-size:9.5px;padding:2px 6px;border:1px solid var(--line2);color:#93a8bd;
  border-radius:2px;cursor:pointer;letter-spacing:.4px}
.chip:hover{border-color:var(--cyan-d);color:#fff}
.chip.on{background:var(--sel);border-color:var(--selb);color:var(--cyan)}
.lst{display:flex;flex-direction:column;gap:1px;padding:3px 4px}
.li{display:flex;align-items:center;gap:6px;padding:3px 7px;background:#0d141d;border:1px solid transparent;cursor:pointer;border-radius:2px}
.li:hover{background:#16202c;border-color:var(--line2)}
.li.sel{background:var(--sel);border-color:var(--selb)}
.li .lin{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:12px}
.li .lsub{font-family:var(--f-mono);font-size:9px;color:var(--dim2)}
.li .lx{color:var(--dim2);width:14px;text-align:center}
.li .lx:hover{color:var(--red)}
.badge{font-family:var(--f-mono);font-size:8.5px;padding:1px 4px;border-radius:2px;letter-spacing:.5px}
.b-cy{background:rgba(34,211,238,.14);color:var(--cyan)}
.b-am{background:rgba(245,158,11,.14);color:var(--amber)}
.b-gr{background:rgba(52,211,153,.14);color:var(--green)}
.b-vi{background:rgba(167,139,250,.14);color:var(--violet)}
.b-rd{background:rgba(244,63,94,.14);color:var(--red)}

/* ============ TIMELINE ============ */
#tlbar{display:flex;align-items:center;gap:3px;padding:3px 6px;background:#0b1017;border-bottom:1px solid var(--line)}
.tlb{width:24px;height:22px;display:grid;place-items:center;color:#9fb4c8;cursor:pointer;border-radius:2px}
.tlb:hover{background:var(--panel3);color:#fff}
.tlb.on{color:var(--cyan);background:var(--sel)}
.tlb svg{width:14px;height:14px;stroke:currentColor;fill:currentColor;stroke-width:0}
.tltime{font-family:var(--f-mono);font-size:11px;color:var(--amber);padding:0 8px;letter-spacing:.5px}
#tlgrid{flex:1;display:flex;min-height:0;overflow:hidden}
#tltracks{flex:0 0 148px;border-right:1px solid var(--line);overflow-y:auto;background:#0c121a}
.trk{display:flex;align-items:center;gap:5px;height:22px;padding:0 6px;border-bottom:1px solid #131c26;font-size:11.5px;color:#a5b9cd;cursor:pointer}
.trk:hover{background:#16202c}
.trk.sel{background:var(--sel);color:#fff}
.trk i{width:7px;height:7px;border-radius:1px;flex:0 0 7px}
#tlcanvasWrap{flex:1;position:relative;overflow:auto}
#tlcanvas{display:block;cursor:crosshair}

/* ============ CONSOLE ============ */
#console{font-family:var(--f-mono);font-size:11px;line-height:1.65;padding:5px 9px}
#console div{white-space:pre-wrap;word-break:break-word}
.c-i{color:#7e94aa}.c-ok{color:var(--green)}.c-w{color:var(--amber)}.c-e{color:var(--red)}.c-t{color:var(--cyan)}
.c-time{color:#3d4d60}

/* ============ NODE GRAPH ============ */
.graphwrap{position:relative;flex:1;overflow:hidden;background:
  radial-gradient(circle at 1px 1px,#1a2534 1px,transparent 0) 0 0/18px 18px,#0a0f16}
.gnode{position:absolute;min-width:132px;background:#131c27;border:1px solid var(--line2);border-radius:3px;
  box-shadow:0 6px 18px rgba(0,0,0,.5);cursor:grab;font-size:11.5px}
.gnode.sel{border-color:var(--cyan);box-shadow:0 0 0 1px var(--cyan),0 6px 20px rgba(34,211,238,.2)}
.gnode .gh{padding:3px 7px;background:#1a2635;border-bottom:1px solid var(--line);font-family:var(--f-mono);
  font-size:9px;letter-spacing:1px;color:var(--cyan);display:flex;justify-content:space-between;border-radius:2px 2px 0 0}
.gnode .gb{padding:4px 7px;color:#c2d4e6}
.gnode .gv{font-family:var(--f-mono);font-size:10px;color:var(--amber)}
.gnode .gport{position:absolute;width:9px;height:9px;background:#0b1017;border:1.5px solid var(--cyan);border-radius:50%;cursor:crosshair}
.gnode .gport.i{left:-5px;top:50%;transform:translateY(-50%)}
.gnode .gport.o{right:-5px;top:50%;transform:translateY(-50%)}
.gnode .gport:hover{background:var(--cyan);box-shadow:0 0 8px var(--cyan)}
.gnode.t-fluid .gh{color:var(--amber)}.gnode.t-fluid .gport{border-color:var(--amber)}
.gnode.t-signal .gh{color:var(--violet)}.gnode.t-signal .gport{border-color:var(--violet)}
.gnode.t-logic .gh{color:var(--green)}.gnode.t-logic .gport{border-color:var(--green)}
#gsvg{position:absolute;inset:0;pointer-events:none;overflow:visible}

/* ============ PAGE DESIGNER ============ */
#pdWrap{position:absolute;inset:0;display:none;background:#0a0f16;overflow:auto}
#pdWrap.on{display:block}
#pdWrap.preview{background:transparent;pointer-events:none}
#pdWrap.preview .wdg{pointer-events:auto}
#pdWrap.preview .wdg[data-role="view3d"]{pointer-events:none}
#pdStage{position:relative;margin:14px auto;background:#0b0f16;border:1px solid var(--line2);
  box-shadow:0 20px 60px rgba(0,0,0,.55);min-height:600px}
#pdStage.grid{background-image:linear-gradient(#141d29 1px,transparent 0),linear-gradient(90deg,#141d29 1px,transparent 0);
  background-size:20px 20px}
.wdg{position:absolute;border:1px dashed transparent;overflow:hidden;font-size:12px}
#pdWrap:not(.preview) .wdg{cursor:move}
#pdWrap:not(.preview) .wdg:hover{border-color:#2c3f55}
#pdWrap:not(.preview) .wdg.sel{border:1px solid var(--cyan);box-shadow:0 0 0 1px rgba(34,211,238,.3)}
.wdg .rs{position:absolute;right:-4px;bottom:-4px;width:9px;height:9px;background:var(--cyan);cursor:nwse-resize;display:none}
#pdWrap:not(.preview) .wdg.sel .rs{display:block}
#pdWrap.preview .wdg{border-color:transparent!important;cursor:default}
.palette{display:grid;grid-template-columns:1fr 1fr;gap:2px;padding:5px}
.pal{display:flex;align-items:center;gap:5px;padding:3px 6px;background:#0d141d;border:1px solid var(--line);
  cursor:grab;font-size:11px;color:#a9bdd1;border-radius:2px}
.pal:hover{border-color:var(--cyan-d);color:#fff;background:#16202c}
.pal svg{width:12px;height:12px;stroke:currentColor;fill:none;stroke-width:1.5;flex:0 0 12px}

/* widget skins (shared with export runtime) */
.w-label{color:#d6e6f5;letter-spacing:.5px;display:flex;align-items:center}
.w-h1{font-size:18px;font-weight:700;letter-spacing:2px;color:#eaf6ff}
.w-sub{font-family:var(--f-mono);font-size:10px;color:var(--dim);letter-spacing:1.2px}
.w-panel{background:var(--panel);border:1px solid var(--line);border-radius:2px}
.w-card{background:linear-gradient(180deg,#111a25,#0d141d);border:1px solid var(--line2);border-radius:3px;padding:8px}
.w-btn{width:100%;height:100%;background:#16202c;border:1px solid var(--line2);color:#cfe0f0;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:6px;letter-spacing:.8px;font-size:12px;border-radius:2px}
.w-btn:hover{background:#1e2b3b;border-color:var(--cyan);color:#fff}

vec3 RRTODT(vec3 v){ vec3 a=v*(v+0.0245786)-0.000090537; vec3 b=v*(0.983729*v+0.4329510)+0.238081; return a/b; }
const mat3 ACESIn=mat3(0.59719,0.07600,0.02840, 0.35458,0.90834,0.13383, 0.04823,0.01566,0.83777);
const mat3 ACESOut=mat3(1.60475,-0.10208,-0.00327, -0.53108,1.10813,-0.07276, -0.07367,-0.00605,1.07602);
vec3 aces(vec3 c){ c=ACESIn*c; c=RRTODT(c); c=ACESOut*c; return clamp(c,0.0,1.0); }
vec3 lin2srgb(vec3 c){ return mix(c*12.92, 1.055*pow(max(c,vec3(0.0001)),vec3(1.0/2.4))-0.055, step(0.0031308,c)); }`;

const QUAD_VS=`varying vec2 vUv; void main(){ vUv=uv; gl_Position=vec4(position.xy,0.0,1.0); }`;

function mkQuad(mat){ const m=new THREE.Mesh(new THREE.PlaneGeometry(2,2),mat); m.frustumCulled=false; return m; }
function mkRT(w,h,o={}){ return new THREE.WebGLRenderTarget(Math.max(2,w|0),Math.max(2,h|0),
  Object.assign({type:THREE.HalfFloatType,minFilter:THREE.LinearFilter,magFilter:THREE.LinearFilter,
  depthBuffer:true,colorSpace:THREE.LinearSRGBColorSpace},o)); }

function buildEnvScene(key){
  const cfg=ENVS[key]||ENVS.studio, sc=new THREE.Scene();
  const sky=new THREE.Mesh(new THREE.SphereGeometry(60,32,24),new THREE.ShaderMaterial({
    side:THREE.BackSide, depthWrite:false,
    uniforms:{cTop:{value:new THREE.Color(cfg.sky[0])},cBot:{value:new THREE.Color(cfg.sky[1])}},
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`uniform vec3 cTop,cBot; varying vec3 vP;
      void main(){ float t=clamp(normalize(vP).y*0.5+0.5,0.0,1.0); gl_FragColor=vec4(mix(cBot,cTop,pow(t,0.75)),1.0);} `}));
  sc.add(sky);
  cfg.lights.forEach(L=>{
    const m=new THREE.Mesh(new THREE.PlaneGeometry(L.s[0],L.s[1]),
      new THREE.MeshBasicMaterial({color:new THREE.Color(L.c).multiplyScalar(L.i),side:THREE.DoubleSide}));
    m.position.set(...L.p); m.lookAt(0,0.6,0); sc.add(m);
  });
  return sc;
}
function applyEnvironment(key){
  if(rendererFallback){
    const bcfg=ENVS[key]||ENVS.studio;
    if(backdrop){ backdrop.material.uniforms.cTop.value.set(bcfg.sky[0]); backdrop.material.uniforms.cBot.value.set(bcfg.sky[1]); }
    return;
  }
  if(!pmrem) pmrem=new THREE.PMREMGenerator(renderer);
  if(envRT) envRT.dispose();
  const es=buildEnvScene(key);
  envRT=pmrem.fromScene(es,0.035,0.1,120);
  scene.environment=envRT.texture;
  const cfg=ENVS[key]||ENVS.studio;
  if(backdrop){
    backdrop.material.uniforms.cTop.value.set(cfg.sky[0]);
    backdrop.material.uniforms.cBot.value.set(cfg.sky[1]);
  }
  es.traverse(o=>{ if(o.geometry)o.geometry.dispose(); if(o.material)o.material.dispose(); });
  RESET();
}

/* ---------- init ---------- */
let rendererFallback=false;
function makeRenderer(opts){
  try{ return new THREE.WebGLRenderer(opts); }
  catch(e){
    rendererFallback=true;
    log('WebGL unavailable: '+(e&&e.message||e)+' — 3D rendering disabled, editor UI remains usable','e');
    const cv=document.createElement('canvas'); cv.className='gl-fallback';
    return {domElement:cv,pixelRatio:1,toneMapping:0,outputColorSpace:'',
      shadowMap:{enabled:false,type:0},localClippingEnabled:false,clippingPlanes:[],
      setPixelRatio(){},getPixelRatio(){return 1;},setSize(){},setClearColor(){},
      setRenderTarget(){},clear(){},render(){},dispose(){},compile(){},readRenderTargetPixels(){}};
  }
}
function initViewport(){
  const host=$('#vp');
  renderer=makeRenderer({antialias:false,powerPreference:'high-performance',stencil:false,preserveDrawingBuffer:true});
  if(rendererFallback){
    host.insertAdjacentHTML('beforeend','<div class="gl-err"><b>WEBGL UNAVAILABLE</b>'
      +'<span>This browser or system could not create a WebGL context, so the 3D viewport is disabled.</span>'
      +'<span>Enable hardware acceleration (or use a current Chrome / Edge / Firefox) and reload.</span></div>');
  }
  pixelRatio=Math.min(devicePixelRatio||1,2);
  renderer.setPixelRatio(pixelRatio);
  renderer.toneMapping=THREE.NoToneMapping;          // tone mapping happens in final pass
  renderer.outputColorSpace=THREE.LinearSRGBColorSpace;
  renderer.shadowMap.enabled=true;
  renderer.shadowMap.type=THREE.PCFSoftShadowMap;
  renderer.localClippingEnabled=true;
  renderer.setClearColor(0x000000,0);
  host.appendChild(renderer.domElement);

  scene=new THREE.Scene();
  camera=new THREE.PerspectiveCamera(36,1,1,6000);
  camera.position.set(430,300,470); camera.lookAt(0,40,0);

  controls=new OrbitControls(camera,renderer.domElement);
  controls.enableDamping=true; controls.dampingFactor=0.09;
  controls.target.set(0,35,0); controls.minDistance=60; controls.maxDistance=2600;
  controls.addEventListener('change',RESET);

  root=new THREE.Group(); root.name='ROOT'; scene.add(root);

  /* backdrop (unlit gradient dome, hidden during AO prepass) */
  backdrop=new THREE.Mesh(new THREE.SphereGeometry(3000,32,24),new THREE.ShaderMaterial({
    side:THREE.BackSide,depthWrite:false,
    uniforms:{cTop:{value:new THREE.Color('#1b2432')},cBot:{value:new THREE.Color('#05070b')}},
    vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
    fragmentShader:`uniform vec3 cTop,cBot; varying vec3 vP;
      void main(){ float t=clamp(normalize(vP).y*0.5+0.5,0.0,1.0); gl_FragColor=vec4(mix(cBot,cTop,pow(t,1.4))*0.7,1.0);} `}));
  backdrop.userData.helper=true; scene.add(backdrop);

  /* lights */
  sunLight=new THREE.DirectionalLight(0xffffff,2.4);
  sunLight.position.copy(sunBase); sunLight.castShadow=true;
  sunLight.shadow.mapSize.set(2048,2048);
  const c=sunLight.shadow.camera; c.left=-420;c.right=420;c.top=420;c.bottom=-420;c.near=60;c.far=1400;
  sunLight.shadow.bias=-0.0009; sunLight.shadow.normalBias=1.2;
  scene.add(sunLight); scene.add(sunLight.target);
  fillLight=new THREE.DirectionalLight(0x8fb6ff,0.45); fillLight.position.set(-300,180,-220); scene.add(fillLight);
  rimLight=new THREE.DirectionalLight(0xffc98a,0.6); rimLight.position.set(-140,90,-380); scene.add(rimLight);

  /* ground + helpers */
  ground=new THREE.Mesh(new THREE.CircleGeometry(1400,72),
    new THREE.MeshStandardMaterial({color:0x0c121a,roughness:0.42,metalness:0.0}));
  ground.rotation.x=-Math.PI/2; ground.position.y=-0.4; ground.receiveShadow=true;
  ground.userData.helper=true; scene.add(ground);

  gridH=new THREE.GridHelper(1200,60,0x1d3346,0x141f2b);
  gridH.material.transparent=true; gridH.material.opacity=0.55; gridH.userData.helper=true; scene.add(gridH);
  axesH=new THREE.AxesHelper(120); axesH.userData.helper=true; scene.add(axesH);

  tctl=new TransformControls(camera,renderer.domElement);
  tctl.addEventListener('dragging-changed',e=>{controls.enabled=!e.value;});
  tctl.addEventListener('objectChange',()=>{ RESET(); syncGizmoToPart(); });
  tctl.setSize(0.72); tctl.visible=false; tctl.enabled=false;
  scene.add(tctl);

  buildPasses();
  applyEnvironment('studio');
  window.addEventListener('resize',resizeViewport);
  new ResizeObserver(resizeViewport).observe($('#vpwrap'));
  resizeViewport();

/* ---------- passes ---------- */
function buildPasses(){
  quadCam=new THREE.OrthographicCamera(-1,1,1,-1,0,1);

  accumQuad=mkQuad(new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
    uniforms:{tPrev:{value:null},tCur:{value:null},w:{value:1}},
    vertexShader:QUAD_VS,
    fragmentShader:`uniform sampler2D tPrev,tCur; uniform float w; varying vec2 vUv;
      void main(){ vec4 p=texture2D(tPrev,vUv), c=texture2D(tCur,vUv); gl_FragColor=mix(p,c,w); }`}));

  aoQuad=mkQuad(new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
    uniforms:{tND:{value:null},radius:{value:26},strength:{value:0.9},proj:{value:new THREE.Vector2(1,1)},
              res:{value:new THREE.Vector2(1,1)},far:{value:4000}},
    vertexShader:QUAD_VS,
    fragmentShader:`uniform sampler2D tND; uniform float radius,strength,far; uniform vec2 proj,res; varying vec2 vUv;
      vec3 viewPos(vec2 uv,float d){ vec2 ndc=uv*2.0-1.0; return vec3(ndc.x/proj.x, ndc.y/proj.y, -1.0)*d; }
      float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
      void main(){
        vec4 nd=texture2D(tND,vUv); float d=nd.a;
        if(d<=0.0||d>=far){ gl_FragColor=vec4(1.0); return; }
        vec3 n=normalize(nd.rgb*2.0-1.0); vec3 p=viewPos(vUv,d);
        float ao=0.0; float ang=hash(vUv*res)*6.283; const int K=14;
        for(int i=0;i<K;i++){
          float fi=(float(i)+0.5)/float(K);
          float r=radius*sqrt(fi); float a=ang+fi*13.0;
          vec2 off=vec2(cos(a),sin(a))*r;
          vec2 suv=vUv+off*0.5*proj/d;
          vec4 snd=texture2D(tND,suv); float sd=snd.a;
          if(sd<=0.0) continue;
          vec3 sp=viewPos(suv,sd); vec3 dif=sp-p; float len=length(dif);
          if(len<0.0001) continue;
          float ndl=max(dot(n,dif/len),0.0);
          ao+=ndl*(radius/(radius+len))*step(len,radius*2.2);
        }
        ao=1.0-clamp(ao/float(K)*2.1*strength,0.0,1.0);
        gl_FragColor=vec4(vec3(ao),1.0);
      }`}));

  brightQuad=mkQuad(new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
    uniforms:{tex:{value:null},thresh:{value:1.0}},vertexShader:QUAD_VS,
    fragmentShader:`uniform sampler2D tex; uniform float thresh; varying vec2 vUv;
      void main(){ vec3 c=texture2D(tex,vUv).rgb; float l=dot(c,vec3(0.2126,0.7152,0.0722));
        gl_FragColor=vec4(c*smoothstep(thresh,thresh*2.0,l),1.0); }`}));

  blurQuad=mkQuad(new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
    uniforms:{tex:{value:null},dir:{value:new THREE.Vector2(1,0)},res:{value:new THREE.Vector2(1,1)}},
    vertexShader:QUAD_VS,
    fragmentShader:`uniform sampler2D tex; uniform vec2 dir,res; varying vec2 vUv;
      void main(){ vec2 t=dir/res; vec3 s=texture2D(tex,vUv).rgb*0.227;
        s+=(texture2D(tex,vUv+t*1.385).rgb+texture2D(tex,vUv-t*1.385).rgb)*0.316;
        s+=(texture2D(tex,vUv+t*3.231).rgb+texture2D(tex,vUv-t*3.231).rgb)*0.070;
        gl_FragColor=vec4(s,1.0); }`}));

  finalQuad=mkQuad(new THREE.ShaderMaterial({depthTest:false,depthWrite:false,
    uniforms:{tAcc:{value:null},tBloom:{value:null},tAO:{value:null},tDof:{value:null},tND:{value:null},
      exposure:{value:1.0},bloomS:{value:0.5},aoS:{value:1.0},useAO:{value:0},useBloom:{value:1},useDof:{value:0},
      focus:{value:400},aperture:{value:1},grain:{value:0.012},vig:{value:0.3},t:{value:0},mode:{value:0}},
    vertexShader:QUAD_VS,
    fragmentShader:`uniform sampler2D tAcc,tBloom,tAO,tDof,tND; uniform float exposure,bloomS,aoS,focus,aperture,grain,vig,t;
      uniform int useAO,useBloom,useDof; varying vec2 vUv; ${ACES_GLSL}
      float hash(vec2 p){ return fract(sin(dot(p,vec2(12.9898,78.233)))*43758.5453); }
      void main(){
        vec3 c=texture2D(tAcc,vUv).rgb;
        if(useDof==1){ float d=texture2D(tND,vUv).a; float coc=clamp(abs(d-focus)/max(focus,1.0)*aperture*2.4,0.0,1.0);
          c=mix(c,texture2D(tDof,vUv).rgb,coc); }
        if(useAO==1){ float ao=texture2D(tAO,vUv).r; c*=mix(1.0,ao,aoS); }
        if(useBloom==1) c+=texture2D(tBloom,vUv).rgb*bloomS;
        c*=exposure;
        c=aces(c);
        float d2=distance(vUv,vec2(0.5)); c*=1.0-vig*smoothstep(0.28,0.95,d2);
        c+=(hash(vUv*vec2(1024.0,768.0)+t)-0.5)*grain;
        gl_FragColor=vec4(lin2srgb(max(c,0.0)),1.0);
      }`}));

  ND_MAT=new THREE.ShaderMaterial({
    vertexShader:`varying vec3 vN; varying float vD;
      void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); vD=-mv.z; vN=normalize(normalMatrix*normal);
        gl_Position=projectionMatrix*mv; }`,
    fragmentShader:`varying vec3 vN; varying float vD;
      void main(){ gl_FragColor=vec4(normalize(vN)*0.5+0.5,vD); }`});
}
let ND_MAT=null;

function resizeViewport(){
  const w=$('#vpwrap').clientWidth||10, h=$('#vpwrap').clientHeight||10;
  vpSize={w,h};
  renderer.setSize(w,h,false);
  camera.aspect=w/h; camera.updateProjectionMatrix();
  const rw=Math.max(2,(w*pixelRatio)|0), rh=Math.max(2,(h*pixelRatio)|0);
  [sceneRT,accA,accB,aoDepthRT,aoRT,bloomA,bloomB,dofA,dofB].forEach(r=>r&&r.dispose());
  sceneRT=mkRT(rw,rh,{samples:4});
  accA=mkRT(rw,rh); accB=mkRT(rw,rh);
  aoDepthRT=mkRT(rw,rh);
  aoRT=mkRT(rw>>1,rh>>1);
  bloomA=mkRT(rw>>2,rh>>2); bloomB=mkRT(rw>>2,rh>>2);
  dofA=mkRT(rw>>1,rh>>1); dofB=mkRT(rw>>1,rh>>1);
  RESET();
  if(typeof layoutViewCube==='function') layoutViewCube();
}

/* halton for stratified jitter */
function halton(i,b){ let f=1,r=0; while(i>0){ f/=b; r+=f*(i%b); i=Math.floor(i/b);} return r; }

function renderNormalDepth(){
  backdrop.visible=false; if(gridH)gridH.visible=false; if(axesH)axesH.visible=false;
  const tv=tctl.visible; tctl.visible=false;
  scene.overrideMaterial=ND_MAT;
  renderer.setRenderTarget(aoDepthRT); renderer.clear(); renderer.render(scene,camera);
  scene.overrideMaterial=null;
  backdrop.visible=(P.render.bg!=='solid'); gridH.visible=P.render.gridOn; axesH.visible=P.settings.showAxes;
  tctl.visible=tv;
}

function renderBloom(srcTex){
  brightQuad.material.uniforms.tex.value=srcTex;
  brightQuad.material.uniforms.thresh.value=P.render.bloomThresh;
  renderer.setRenderTarget(bloomA); renderer.render(brightQuad,quadCam);
  const rw=bloomA.width, rh=bloomA.height;
  for(let i=0;i<2;i++){
    blurQuad.material.uniforms.res.value.set(rw,rh);
    blurQuad.material.uniforms.tex.value=bloomA.texture; blurQuad.material.uniforms.dir.value.set(1.4,0);
    renderer.setRenderTarget(bloomB); renderer.render(blurQuad,quadCam);
    blurQuad.material.uniforms.tex.value=bloomB.texture; blurQuad.material.uniforms.dir.value.set(0,1.4);
    renderer.setRenderTarget(bloomA); renderer.render(blurQuad,quadCam);
  }
}
function renderDofBlur(srcTex){
  const rw=dofA.width, rh=dofA.height;
  blurQuad.material.uniforms.res.value.set(rw,rh);
  blurQuad.material.uniforms.tex.value=srcTex; blurQuad.material.uniforms.dir.value.set(2.0,0);
  renderer.setRenderTarget(dofB); renderer.render(blurQuad,quadCam);
  blurQuad.material.uniforms.tex.value=dofB.texture; blurQuad.material.uniforms.dir.value.set(0,2.0);
  renderer.setRenderTarget(dofA); renderer.render(blurQuad,quadCam);
}

function renderFrame(dt){
  const R=P.render;
  if(needsReset){ samples=0; needsReset=false; }
  const wantsSamples = !S.playing && samples<R.maxSamples;

  if(samples===0 || wantsSamples){
    const jx=(halton(samples+1,2)-0.5), jy=(halton(samples+1,3)-0.5);
    camera.setViewOffset(vpSize.w,vpSize.h,jx,jy,vpSize.w,vpSize.h);
    // area-light emulation: jitter the sun on a disc -> soft, converging shadows
    if(samples>0 && R.shadows){
      const a=halton(samples,5)*Math.PI*2, r=Math.sqrt(halton(samples,7))*R.softness*26;
      sunLight.position.set(sunBase.x+Math.cos(a)*r, sunBase.y+Math.sin(a)*r*0.6, sunBase.z+Math.sin(a)*r);
    } else sunLight.position.copy(sunBase);

    renderer.setRenderTarget(sceneRT); renderer.clear(); renderer.render(scene,camera);
    camera.clearViewOffset();

    accumQuad.material.uniforms.tPrev.value=accA.texture;
    accumQuad.material.uniforms.tCur.value=sceneRT.texture;
    accumQuad.material.uniforms.w.value=1/(samples+1);
    renderer.setRenderTarget(accB); renderer.render(accumQuad,quadCam);
    const tmp=accA; accA=accB; accB=tmp;
    samples++;

    if(samples===1 && (R.ao||R.dof)) renderNormalDepth();
    if(R.bloom && (samples<6 || samples%12===0)) renderBloom(accA.texture);
    if(R.ao && samples===1){
      const u=aoQuad.material.uniforms;
      u.tND.value=aoDepthRT.texture; u.radius.value=R.aoRadius; u.strength.value=R.aoStrength;
      const th=Math.tan(rad(camera.fov)/2);
      u.proj.value.set(1/(th*camera.aspect),1/th);
      u.res.value.set(aoRT.width,aoRT.height);
      renderer.setRenderTarget(aoRT); renderer.render(aoQuad,quadCam);
    }
    if(R.dof && (samples<4||samples%16===0)) renderDofBlur(accA.texture);
  }

  const u=finalQuad.material.uniforms;
  u.tAcc.value=accA.texture; u.tBloom.value=bloomA.texture; u.tAO.value=aoRT.texture;
  u.tDof.value=dofA.texture; u.tND.value=aoDepthRT.texture;
  u.exposure.value=R.exposure; u.bloomS.value=R.bloomStrength; u.aoS.value=R.aoStrength;
  u.useAO.value=R.ao?1:0; u.useBloom.value=R.bloom?1:0; u.useDof.value=R.dof?1:0;
  u.focus.value=R.focus; u.aperture.value=R.aperture; u.grain.value=R.grain; u.vig.value=R.vignette;
  u.t.value+=dt;
  renderer.setRenderTarget(null); renderer.render(finalQuad,quadCam);

  S.samples=samples;
  $('#accBar').firstElementChild.style.width=Math.min(100,samples/R.maxSamples*100)+'%';
}

/* ---------- display modes ---------- */
function applyDisplayMode(mode){
  P.render.mode=mode;
  root.traverse(o=>{
    if(!o.isMesh||!o.material) return;
    const m=o.material; const base=o.userData.baseMat||{};
    m.wireframe=(mode==='wireframe');
    if(mode==='xray'){ m.transparent=true; m.opacity=0.24; m.depthWrite=false; m.side=THREE.DoubleSide; }
    else if(mode==='transparent'){ m.transparent=true; m.opacity=0.45; m.depthWrite=false; m.side=THREE.DoubleSide; }
    else { m.transparent=base.transparent||false; m.opacity=base.opacity!=null?base.opacity:1;
           m.depthWrite=true; m.side=THREE.FrontSide; }
    m.needsUpdate=true;
  });
  root.traverse(o=>{ if(o.userData.edges) o.userData.edges.visible=(mode==='shadedEdges'||mode==='wireframe'); });
  RESET();
}
/* ============================================================
   MATERIAL LIBRARY  (shared with exported runtime)
   ============================================================ */
const MATLIB={

const _matCache=new Map();
function getMaterial(key,over){
  const k=key+(over?JSON.stringify(over):'');
  if(_matCache.has(k)) return _matCache.get(k);
  const d=Object.assign({},MATLIB[key]||MATLIB.steel,over||{});
  const m=new THREE.MeshPhysicalMaterial({
    color:new THREE.Color(d.color), metalness:d.metalness??0.8, roughness:d.roughness??0.4,
    clearcoat:d.clearcoat??0, clearcoatRoughness:0.12,
    transparent:!!d.transparent, opacity:d.opacity??1, transmission:d.transmission??0,
    emissive:new THREE.Color(d.emissive||'#000000'), emissiveIntensity:d.emissiveIntensity??1,
    envMapIntensity:1.0, side:THREE.FrontSide
  });
  m.userData.key=key;
  _matCache.set(k,m); return m;
}

/* ============================================================
   GEOMETRY FACTORY  (spec primitives -> BufferGeometry)
   ============================================================ */
function primGeom(p){
  const a=p.a||[];
  switch(p.t){
    case 'box':   return new THREE.BoxGeometry(a[0],a[1],a[2]);
    case 'cyl':   return new THREE.CylinderGeometry(a[0],a[1],a[2],a[3]||48,1,!!a[4]);
    case 'sph':   return new THREE.SphereGeometry(a[0],a[1]||28,a[2]||20);
    case 'torus': return new THREE.TorusGeometry(a[0],a[1],a[2]||18,a[3]||44);
    case 'cone':  return new THREE.ConeGeometry(a[0],a[1],a[2]||36);
    case 'ring':  return new THREE.RingGeometry(a[0],a[1],a[2]||48);
    case 'tube':{ const pts=(p.pts||[]).map(v=>new THREE.Vector3(v[0],v[1],v[2]));
                  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),a[0]||40,a[1]||6,14,false); }
    case 'helix':{ const [r,pitch,turns,tr]=a, pts=[];
                  for(let i=0;i<=turns*40;i++){ const t=i/40; pts.push(new THREE.Vector3(t*pitch,Math.cos(t*6.2832)*r,Math.sin(t*6.2832)*r)); }
                  return new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts),turns*40,tr||3,10,false); }
    case 'lathe':{ const pts=(p.pts||[]).map(v=>new THREE.Vector2(v[0],v[1]));
                  return new THREE.LatheGeometry(pts,a[0]||48); }
    default: return new THREE.BoxGeometry(10,10,10);
  }
}
function buildPartMesh(part){
  const g=new THREE.Group();
  g.name=part.name; g.userData.partId=part.id;
  (part.prims||[]).forEach(pr=>{
    const geo=primGeom(pr);
    const mat=getMaterial(pr.mat||part.mat||'steel');
    const m=new THREE.Mesh(geo,mat);
    if(pr.p)m.position.set(...pr.p); if(pr.r)m.rotation.set(...pr.r); if(pr.s)m.scale.set(...pr.s);
    m.castShadow=true; m.receiveShadow=true;
    m.userData.partId=part.id;
    m.userData.baseMat={transparent:mat.transparent,opacity:mat.opacity};
    g.add(m);
  });
  if(part.pos)g.position.set(...part.pos);
  if(part.rot)g.rotation.set(...part.rot);
  g.userData.rest={p:g.position.clone(),q:g.quaternion.clone()};
  return g;
}

/* ============================================================
   SCENE ASSEMBLY
   ============================================================ */
const PARTOBJ=new Map();     // partId -> THREE.Group
const IMPORTED_OBJ=new Map(); // imported meshes survive undo/redo
let modelBounds=new THREE.Box3();

function rebuildModel(){
  [...root.children].forEach(c=>{ root.remove(c); c.traverse(o=>{ if(o.geometry)o.geometry.dispose(); }); });
  PARTOBJ.clear();
  const spec=P.modelSpec; if(!spec) return;
  spec.parts.forEach(pt=>{
    const g=buildPartMesh(pt);
    root.add(g); PARTOBJ.set(pt.id,g);
    if(!P.parts[pt.id]) P.parts[pt.id]={id:pt.id,name:pt.name,partNo:pt.partNo,material:pt.mat,
      visible:true,mass:0,parent:pt.parent||'assembly',
      explode:pt.explode||{dir:[0,1,0],dist:120,order:1}};
  });
  /* imported meshes */
  (P.imported||[]).forEach(im=>{ const o=IMPORTED_OBJ.get(im.id)||im._obj;
    if(o){ root.add(o); PARTOBJ.set(im.id,o); } });
  modelBounds.setFromObject(root);
  applyPartStates();
  applyDisplayMode(P.render.mode);
  updateStats();
  RESET();
}
function applyPartStates(){
  PARTOBJ.forEach((g,id)=>{ const d=P.parts[id]; if(!d)return; g.visible=d.visible!==false; });
}
function updateStats(){
  let tris=0; root.traverse(o=>{ if(o.isMesh&&o.geometry&&o.visible){ const g=o.geometry;
    tris += g.index?g.index.count/3:(g.attributes.position?g.attributes.position.count/3:0); }});
  $('#stParts').textContent=Object.keys(P.parts).length;
  $('#stTris').textContent=tris>1000?(tris/1000).toFixed(1)+'k':tris|0;
}

/* ---------- selection ---------- */
const ray=new THREE.Raycaster(); const ndc=new THREE.Vector2();
function pickAt(cx,cy){
  const r=renderer.domElement.getBoundingClientRect();
  ndc.x=((cx-r.left)/r.width)*2-1; ndc.y=-((cy-r.top)/r.height)*2+1;
  ray.setFromCamera(ndc,camera);
  const hits=ray.intersectObjects(root.children,true);
  for(const h of hits){ if(h.object.visible && h.object.userData.partId) return h; }
  return null;
}
function setEmissive(id,col,inten){
  const g=PARTOBJ.get(id); if(!g)return;
  g.traverse(o=>{ if(o.isMesh){ if(!o.userData._mat){ o.userData._mat=o.material; }
    if(col===null){ o.material=o.userData._mat; }
    else { if(!o.userData._hi){ o.userData._hi=o.userData._mat.clone(); }
      o.userData._hi.copy(o.userData._mat); o.userData._hi.emissive=new THREE.Color(col);
      o.userData._hi.emissiveIntensity=inten; o.material=o.userData._hi; } }});
}
function selectParts(ids,additive=false){
  const prev=S.sel.slice();
  S.sel = additive ? [...new Set([...S.sel,...ids])] : ids.slice();
  prev.forEach(id=>{ if(!S.sel.includes(id)) setEmissive(id,null); });
  S.sel.forEach(id=>setEmissive(id,'#22d3ee',0.55));
  $('#stSel').textContent = S.sel.length===0?'—':(S.sel.length===1?(P.parts[S.sel[0]]?.name||S.sel[0]):S.sel.length+' parts');
  refreshTree(); buildProperties();
  if(S.sel.length===1 && tctl.enabled){ tctl.attach(PARTOBJ.get(S.sel[0])); } else tctl.detach();
  RESET();
}
function hoverPart(id){
  if(S.hover===id) return;
  if(S.hover && !S.sel.includes(S.hover)) setEmissive(S.hover,null);
  S.hover=id;
  if(id && !S.sel.includes(id)) setEmissive(id,'#0e7490',0.35);
  RESET();
}
function syncGizmoToPart(){
  if(S.sel.length!==1) return;
  const g=PARTOBJ.get(S.sel[0]); if(!g)return;
  g.userData.rest={p:g.position.clone(),q:g.quaternion.clone()};
}

/* ---------- visibility ops ---------- */
function setVisible(ids,v){ ids.forEach(id=>{ if(P.parts[id]) P.parts[id].visible=v; }); applyPartStates(); refreshTree(); updateStats(); RESET(); }
function isolate(ids){ Object.keys(P.parts).forEach(id=>P.parts[id].visible=ids.includes(id)); applyPartStates(); refreshTree(); RESET(); }
function showAll(){ Object.keys(P.parts).forEach(id=>P.parts[id].visible=true); applyPartStates(); refreshTree(); RESET(); }

/* ---------- camera views ---------- */
let camTween=null;
function frameBox(box,dist=1.35){
  const c=box.getCenter(new THREE.Vector3()), s=box.getSize(new THREE.Vector3());
  const r=Math.max(s.x,s.y,s.z)*0.5;
  const d=r/Math.sin(rad(camera.fov)/2)*dist;
  return {c,d};
}
const VIEWS={
  front:[0,0,1], back:[0,0,-1], left:[-1,0,0], right:[1,0,0], top:[0,1,0.001], bottom:[0,-1,0.001],
  iso:[0.78,0.55,0.85], iso2:[-0.78,0.5,-0.85], default:[0.78,0.55,0.85]
};
function setView(name,inst=false){
  const v=VIEWS[name]||VIEWS.iso;
  modelBounds.setFromObject(root);
  const {c,d}=frameBox(modelBounds);
  const dir=new THREE.Vector3(...v).normalize();
  const pos=c.clone().add(dir.multiplyScalar(d));
  moveCamera(pos,c,inst?0:0.55);
  log('View · '+name.toUpperCase(),'t');
}
function fitAll(){ modelBounds.setFromObject(root); const {c,d}=frameBox(modelBounds);
  const dir=camera.position.clone().sub(controls.target).normalize();
  moveCamera(c.clone().add(dir.multiplyScalar(d)),c,0.45); }
function moveCamera(pos,target,dur=0.5){
  if(dur<=0){ camera.position.copy(pos); controls.target.copy(target); controls.update(); RESET(); return; }
  camTween={p0:camera.position.clone(),p1:pos.clone(),t0:controls.target.clone(),t1:target.clone(),t:0,dur};
}
function updateCameraTween(dt){
  if(!camTween)return;
  camTween.t+=dt; let k=clamp(camTween.t/camTween.dur,0,1);
  k=k<0.5?4*k*k*k:1-Math.pow(-2*k+2,3)/2;
  camera.position.lerpVectors(camTween.p0,camTween.p1,k);
  controls.target.lerpVectors(camTween.t0,camTween.t1,k);
  controls.update(); RESET();
  if(camTween.t>=camTween.dur) camTween=null;
}

function defaultJoints(){
  const J=(id,name,child,type,axis,driver,ratio,extra)=>Object.assign(

    J('j_input','Input Shaft','inputShaft','revolute',[1,0,0],'steerAngle',1),
    J('j_tbar','Torsion Bar','torsionBar','revolute',[1,0,0],'steerAngle',0.985),
    J('j_worm','Worm Screw Shaft','wormShaft','screw',[1,0,0],'steerAngle',1),
    J('j_nut','Ball Nut (screw→linear)','ballNut','prismatic',[1,0,0],'pistonStroke',1),
    J('j_piston','Power Piston','piston','prismatic',[1,0,0],'pistonStroke',1),
    J('j_sector','Sector Shaft (rack→pinion)','sectorShaft','revolute',[0,0,1],'sectorAngle',1),
    J('j_pitman','Pitman Arm','pitmanArm','revolute',[0,0,1],'sectorAngle',1),
    J('j_valve','Rotary Valve Spool','valveHousing','revolute',[1,0,0],'steerAngle',0.02,{min:-6,max:6}),
  ];
}
function solveMechanism(){
  P.joints.forEach(j=>{
    const g=PARTOBJ.get(j.child); if(!g||!g.userData.rest) return;
    const drv=pv(j.driver);
    let val=clamp(drv*(j.ratio??1)+(j.offset||0),j.min,j.max);
    j._val=val;
    const ax=new THREE.Vector3(...(j.axis||[1,0,0])).normalize();
    const rest=g.userData.rest;
    g.position.copy(rest.p); g.quaternion.copy(rest.q);
    if(j.type==='revolute'||j.type==='screw'||j.type==='cylindrical'||j.type==='hinge'||j.type==='gear'||j.type==='worm'){
      g.quaternion.multiply(new THREE.Quaternion().setFromAxisAngle(ax,rad(val)));
    }
    if(j.type==='prismatic'||j.type==='slider'||j.type==='linear'){
      g.position.add(ax.clone().multiplyScalar(val));
    }
    if(j.type==='cylindrical'||j.type==='screw'){
      const lin=(j.type==='screw')? (val/360)*pv('lead')*-1 : 0;
      if(lin) g.position.add(ax.clone().multiplyScalar(lin*0));
    }
  });
}

/* ============================================================
   HYDRAULIC SOLVER  (steady-state assist model)
   ============================================================ */
let _lastAngle=0;
function solveHydraulics(dt){
  const ang=pv('steerAngle'), lead=pv('lead'), R=pv('pitchRadius'), bore=pv('bore');
  const rate=dt>0?(ang-_lastAngle)/dt:0; _lastAngle=ang;
  P.parameters.steerRate.value=lerp(pv('steerRate'),rate,0.25);

  const stroke=-(ang/360)*lead;                       // mm  (screw kinematics)
  P.parameters.pistonStroke.value=clamp(stroke,-pv('bore'),pv('bore'));
  P.parameters.sectorAngle.value=clamp(deg(stroke/R)*-1,-52,52);

  const area=Math.PI/4*bore*bore;                     // mm²
  const need=(pv('loadTorque')*1000)/Math.max(R,1);   // N at rack
  const assist=pv('assistOn')&&pv('pumpOn')?1:0;
  const dyn=Math.min(1,Math.abs(pv('steerRate'))/220);
  let p=assist? clamp((need*(0.55+0.45*dyn))/area*10,0,pv('reliefPressure')) : 2;
  P.parameters.pressure.value=lerp(pv('pressure'),p,0.2);

  const vel=Math.abs(pv('steerRate'))/360*lead;       // mm/s
  const q=clamp(area*vel*60/1e6,0,pv('pumpFlow'));    // L/min
  P.parameters.flowRate.value=lerp(pv('flowRate'),pv('pumpOn')?Math.max(q,0.4):0,0.2);
  P.parameters.pistonForce.value=(pv('pressure')/10)*area/1000;             // kN
  P.parameters.outputTorque.value=pv('pistonForce')*1000*R/1000;            // N·m
}
let _inSolve=false;
function solve(dt=0){
  if(_inSolve) return;
  _inSolve=true;
  try{ solveHydraulics(dt); solveMechanism(); applyExplode(); evalLogic(); updateHUD(); }
  finally{ _inSolve=false; }
}

const FLUIDOBJ=new Map();
function rebuildFluids(){
  FLUIDOBJ.forEach(o=>{ scene.remove(o.group); o.group.traverse(x=>x.geometry&&x.geometry.dispose()); });
  FLUIDOBJ.clear();
  P.fluidSystems.forEach(f=>{
    const grp=new THREE.Group(); grp.userData.helper=true;
    const curve=new THREE.CatmullRomCurve3(f.points.map(p=>new THREE.Vector3(...p)));
    const tube=new THREE.Mesh(new THREE.TubeGeometry(curve,120,2.0,8,false),
      new THREE.MeshBasicMaterial({color:new THREE.Color(f.color),transparent:true,opacity:0.16}));
    grp.add(tube);
    const n=Math.max(20,f.density|0), pos=new Float32Array(n*3), tArr=new Float32Array(n);
    for(let i=0;i<n;i++){ tArr[i]=i/n; const p=curve.getPointAt(tArr[i]); pos[i*3]=p.x;pos[i*3+1]=p.y;pos[i*3+2]=p.z; }
    const g=new THREE.BufferGeometry(); g.setAttribute('position',new THREE.BufferAttribute(pos,3));
    const sprite=particleSprite(f.color);
    const pts=new THREE.Points(g,new THREE.PointsMaterial({size:f.size*3.4,map:sprite,transparent:true,
      depthWrite:false,blending:THREE.AdditiveBlending,color:new THREE.Color(f.color),sizeAttenuation:true}));
    grp.add(pts);
    scene.add(grp);
    FLUIDOBJ.set(f.id,{group:grp,pts,curve,t:tArr,phase:0,def:f});
  });
  RESET();
}
let _sprite=null;
function particleSprite(){
  if(_sprite)return _sprite;
  const c=document.createElement('canvas'); c.width=c.height=64; const x=c.getContext('2d');
  const g=x.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,'rgba(255,255,255,1)'); g.addColorStop(0.35,'rgba(255,255,255,.55)'); g.addColorStop(1,'rgba(255,255,255,0)');
  x.fillStyle=g; x.fillRect(0,0,64,64);
  _sprite=new THREE.CanvasTexture(c); return _sprite;
}
function updateFluids(dt,time){
  const show=!!pv('flowOn');
  FLUIDOBJ.forEach(o=>{
    const f=o.def;
    o.group.visible=show&&f.active!==false;
    if(!o.group.visible)return;
    const rate=f.rateParam?pv(f.rateParam):1;
    const v=(rate/12)*f.speed*0.22*(f.reverse?-1:1);
    const puls=1+Math.sin(time*9)*f.pulsation*0.25;
    o.phase=(o.phase+dt*v*puls+1)%1;
    const arr=o.pts.geometry.attributes.position.array, n=o.t.length;
    for(let i=0;i<n;i++){
      let t=(o.t[i]+o.phase)%1; if(t<0)t+=1;
      const p=o.curve.getPointAt(t);
      const j=f.turbulence*2.2;
      arr[i*3]=p.x+Math.sin(time*6+i)*j; arr[i*3+1]=p.y+Math.cos(time*5.3+i*1.7)*j; arr[i*3+2]=p.z+Math.sin(time*4.7+i*2.3)*j;
    }
    o.pts.geometry.attributes.position.needsUpdate=true;
    const pr=f.pressureParam?pv(f.pressureParam)/Math.max(1,pv('reliefPressure')):0.5;
    o.pts.material.opacity=clamp(0.35+pr*0.65,0.2,1);
    o.pts.material.size=f.size*(2.4+pr*2.4);
  });
  if(show) RESET();
}

  const ctx=SND.ctx;
  const noiseBuf=ctx.createBuffer(1,ctx.sampleRate*2,ctx.sampleRate);
  const d=noiseBuf.getChannelData(0); for(let i=0;i<d.length;i++)d[i]=Math.random()*2-1;
  SND.noise=noiseBuf;
  /* continuous engines */
  const mkNoise=(type,freq,q,g)=>{ const s=ctx.createBufferSource(); s.buffer=noiseBuf; s.loop=true;
    const f=ctx.createBiquadFilter(); f.type=type; f.frequency.value=freq; f.Q.value=q;
    const gn=ctx.createGain(); gn.gain.value=0; s.connect(f); f.connect(gn); gn.connect(SND.master); s.start();
    return {gain:gn,filter:f}; };
  SND.engines.hiss=mkNoise('bandpass',1900,1.2);
  const hum=ctx.createOscillator(); hum.type='sawtooth'; hum.frequency.value=88;
  const humF=ctx.createBiquadFilter(); humF.type='lowpass'; humF.frequency.value=420;
  const humG=ctx.createGain(); humG.gain.value=0;
  hum.connect(humF); humF.connect(humG); humG.connect(SND.master); hum.start();
  SND.engines.hum={gain:humG,osc:hum};
  const wh=ctx.createOscillator(); wh.type='triangle'; wh.frequency.value=340;
  const whG=ctx.createGain(); whG.gain.value=0; wh.connect(whG); whG.connect(SND.master); wh.start();
  SND.engines.whine={gain:whG,osc:wh};
  SND.on=true; log('Audio engine started','ok');
}
function soundDef(id){ return P.sounds.find(s=>s.id===id); }
function playSound(id,opt={}){
  if(!SND.ctx) return;
  const def=soundDef(id)||{synth:id,vol:0.4};
  const ctx=SND.ctx, t=ctx.currentTime, vol=(opt.vol??def.vol??0.35);
  const env=(g,a,d,peak)=>{ g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(Math.max(peak,0.0002),t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d); };
  const noise=(f,q,a,d,type='bandpass')=>{ const s=ctx.createBufferSource(); s.buffer=SND.noise;
    const bp=ctx.createBiquadFilter(); bp.type=type; bp.frequency.value=f; bp.Q.value=q;
    const g=ctx.createGain(); s.connect(bp); bp.connect(g); g.connect(SND.master); env(g,a,d,vol); s.start(t); s.stop(t+a+d+0.05); };
  const tone=(f,f2,a,d,type='sine')=>{ const o=ctx.createOscillator(); o.type=type; o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
    const g=ctx.createGain(); o.connect(g); g.connect(SND.master); env(g,a,d,vol); o.start(t); o.stop(t+a+d+0.05); };
  switch(def.synth||id){
    case 'click': noise(2600,6,0.002,0.05); break;
    case 'clunk': tone(160,60,0.004,0.28,'square'); noise(400,1.4,0.004,0.16); break;
    case 'slide': noise(900,0.8,0.06,0.5); break;
    case 'wrench': noise(3200,4,0.004,0.09); setTimeout(()=>playSound('click',{vol:vol*0.6}),70); break;
    case 'balls': for(let i=0;i<7;i++) setTimeout(()=>noise(3000+Math.random()*1800,8,0.002,0.04),i*45); break;
    case 'relief': noise(1400,1.0,0.02,0.55); tone(700,240,0.02,0.4,'sawtooth'); break;
    case 'beep': tone(880,880,0.01,0.14,'square'); break;
    case 'servo': tone(230,520,0.05,0.22,'sawtooth'); break;
    default: noise(1200,2,0.01,0.2);
  }
  if(def.buffer&&SND.buffers[def.id]){ const s=ctx.createBufferSource(); s.buffer=SND.buffers[def.id];
    const g=ctx.createGain(); g.gain.value=vol; s.connect(g); g.connect(SND.master); s.start(); }
}
function updateSoundEngines(){
  if(!SND.ctx||!SND.on)return;
  const e=SND.engines, t=SND.ctx.currentTime;
  const pump=pv('pumpOn')?1:0, flow=clamp(pv('flowRate')/12,0,1), rate=clamp(Math.abs(pv('steerRate'))/300,0,1);
  const gd=soundDef('pump'), gh=soundDef('hiss'), gw=soundDef('whine');
  e.hum.gain.gain.setTargetAtTime(pump*(gd?gd.vol:0.25)*(0.6+0.4*flow),t,0.15);
  e.hum.osc.frequency.setTargetAtTime(88+flow*46,t,0.2);
  e.hiss.gain.gain.setTargetAtTime(flow*(gh?gh.vol:0.3)*(0.35+pv('pressure')/Math.max(pv('reliefPressure'),1)*0.65),t,0.12);
  e.hiss.filter.frequency.setTargetAtTime(1500+pv('pressure')*8,t,0.2);
  e.whine.gain.gain.setTargetAtTime(rate*(gw?gw.vol:0.18),t,0.1);
  e.whine.osc.frequency.setTargetAtTime(300+rate*520,t,0.15);
}

const WP={playing:false,idx:0,t:0};
function wpGoto(i,animate=true){
  const steps=P.workingPrinciple; if(!steps.length)return;
  WP.idx=clamp(i,0,steps.length-1); WP.t=0; S.wpStep=WP.idx;
  const st=steps[WP.idx];
  Object.entries(st.set||{}).forEach(([k,v])=>setParam(k,v,true));
  if(st.cam) moveCamera(new THREE.Vector3(...st.cam.p),new THREE.Vector3(...st.cam.t),animate?0.8:0);
  Object.keys(P.parts).forEach(id=>{ if(!S.sel.includes(id)) setEmissive(id,null); });
  (st.highlight||[]).forEach(id=>setEmissive(id,'#f59e0b',0.45));
  if(st.sound) playSound(st.sound);
  solve(); refreshPane('R'); refreshWPList(); RESET();
  log('Working principle · step '+(WP.idx+1)+' — '+st.title,'t');
}
function wpPlay(){ WP.playing=true; wpGoto(WP.idx); log('Working principle sequence started','ok'); }
function wpStop(){ WP.playing=false; Object.keys(P.parts).forEach(id=>{ if(!S.sel.includes(id)) setEmissive(id,null); }); }
function updateWP(dt){
  if(!WP.playing)return;
  const st=P.workingPrinciple[WP.idx]; if(!st){WP.playing=false;return;}
  WP.t+=dt;
  const tgt=st.set||{};
  Object.entries(tgt).forEach(([k,v])=>{ const p=P.parameters[k]; if(!p||p.type==='bool')return;
    p.value=lerp(p.value,v,clamp(dt*2.2,0,1)); });
  if(WP.t>=st.dur){
    if(WP.idx<P.workingPrinciple.length-1) wpGoto(WP.idx+1);
    else { WP.playing=false; log('Working principle sequence complete','ok'); fireEvent('onComplete','workingPrinciple'); }
  }
}

function sampleTrack(a,t){
  const k=a.keys; if(!k.length)return 0;
  if(t<=k[0].t)return k[0].v;
  if(t>=k[k.length-1].t)return k[k.length-1].v;
  for(let i=0;i<k.length-1;i++){ if(t>=k[i].t&&t<=k[i+1].t){
    const u=(t-k[i].t)/Math.max(1e-6,k[i+1].t-k[i].t);
    const e=u<0.5?2*u*u:1-Math.pow(-2*u+2,2)/2;
    return lerp(k[i].v,k[i+1].v,e); } }
  return k[k.length-1].v;
}
function updateTimeline(dt){
  if(!S.playing)return;
  S.time+=dt*S.speed;
  if(S.time>S.duration){ if(S.loop)S.time=0; else {S.time=S.duration; S.playing=false; fireEvent('onComplete','timeline'); refreshTimelineBar();} }
  P.animations.forEach(a=>{ if(a.enabled&&P.parameters[a.target]) setParam(a.target,sampleTrack(a,S.time),true); });
  drawTimeline(); updateHUD();
}

const _logicState={};
function evalLogic(){
  (P.logic||[]).forEach(r=>{
    if(!r.active)return;
    const v=pv(r.cond.param), c=r.cond.value; let res=false;
    switch(r.cond.op){ case '>':res=v>c;break; case '<':res=v<c;break; case '>=':res=v>=c;break;
      case '<=':res=v<=c;break; case '==':res=Math.abs(v-c)<1e-6;break; case '!=':res=Math.abs(v-c)>=1e-6;break;
      case 'between':res=v>=c&&v<=(r.cond.value2??c);break; }
    if(_logicState[r.id]!==res){ _logicState[r.id]=res; (res?r.then:(r.else_||[])).forEach(runAction); }
  });
  const sa=pv('sectorAngle');
  if(Math.abs(sa)>=51.5 && !_logicState._stop){ _logicState._stop=true; fireEvent('onLimitReached','sectorAngle'); }
  if(Math.abs(sa)<50) _logicState._stop=false;
  const pr=pv('pressure');
  if(pr>=pv('reliefPressure')-1.5 && !_logicState._rel){ _logicState._rel=true; fireEvent('onPressureChange','pressure'); }
  if(pr<pv('reliefPressure')-8) _logicState._rel=false;
}
function fireEvent(on,source){
  (P.events||[]).forEach(e=>{ if(e.on===on&&(!e.source||e.source===source)) e.actions.forEach(runAction); });
}
function runAction(a){
  if(!a)return;
  switch(a.type){
    case 'setParam': setParam(a.target,a.value); break;
    case 'playSound': playSound(a.target); break;
    case 'playAnimation': S.playing=true; refreshTimelineBar(); break;
    case 'stopAnimation': S.playing=false; refreshTimelineBar(); break;
    case 'explode': animateParam('explode',1,a.value||1.6); break;
    case 'unexplode': animateParam('explode',0,a.value||1.6); break;
    case 'camera': setView(a.target||'iso'); break;
    case 'showPart': setVisible([a.target],true); break;
    case 'hidePart': setVisible([a.target],false); break;
    case 'isolate': isolate([a.target]); break;
    case 'showAll': showAll(); break;
    case 'highlight': setEmissive(a.target,'#f59e0b',0.5); break;
    case 'startWP': wpPlay(); break;
    case 'wpNext': wpGoto(WP.idx+1); break;
    case 'wpPrev': wpGoto(WP.idx-1); break;
    case 'wpGoto': wpGoto((a.value|0)); break;
    case 'setMode': applyDisplayMode(a.target); break;
    case 'section': SECT.on=!SECT.on; updateClipping(); break;
    case 'reset': resetSimulation(); break;
    case 'log': log(a.target,'t'); break;
    default: log('Unknown action: '+a.type,'w');
  }
}
const _tweens=[];
function animateParam(id,to,dur=1){
  const p=P.parameters[id]; if(!p)return;
  _tweens.push({id,from:p.value,to,t:0,dur});
}
function updateTweens(dt){
  for(let i=_tweens.length-1;i>=0;i--){
    const w=_tweens[i]; w.t+=dt;
    const k=clamp(w.t/w.dur,0,1), e=k<0.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    setParam(w.id,lerp(w.from,w.to,e),true);
    if(k>=1)_tweens.splice(i,1);
  }
  if(_tweens.length)RESET();
}
function resetSimulation(){
  Object.values(P.parameters).forEach(p=>{ if(p.source!=='solver') p.value=p.def; });
  S.time=0; S.playing=false; WP.playing=false; WP.idx=0;
  Object.keys(P.parts).forEach(id=>{ if(!S.sel.includes(id)) setEmissive(id,null); });
  solve(); refreshAllPanels(); RESET(); log('Simulation reset','w');
}

function treeNode(label,{icon='cube',depth=0,id=null,open=null,kind='',badge='',hidden=false,sel=false,onClick,onToggle,onEye,ctx}={}){
  const n=el('div','tn'+(sel?' sel':'')+(hidden?' hid':''));
  n.style.paddingLeft=(4+depth*13)+'px';
  const tw=el('div','tw'); if(open!==null){ tw.innerHTML=ico(open?'chevd':'chev'); tw.onclick=e=>{e.stopPropagation(); onToggle&&onToggle();}; }
  const ti=el('div','ti',ico(icon));
  const tl=el('div','tl',esc(label));
  n.append(tw,ti,tl);
  if(badge) n.appendChild(el('span','tag',badge));
  if(onEye){ const e2=el('div','teye',ico(hidden?'eyeoff':'eye')); e2.onclick=ev=>{ev.stopPropagation(); onEye();}; n.appendChild(e2); }
  n.onclick=()=>onClick&&onClick();
  if(ctx) n.oncontextmenu=e=>{ e.preventDefault(); showContext(e.clientX,e.clientY,ctx()); };
  return n;
}

/* ---------- context menus ---------- */
function showContext(x,y,rows){
  const m=$('#ctx'); m.innerHTML='';
  rows.forEach(r=>{
    if(r==='-'){ m.appendChild(el('div','msep')); return; }
    if(r.head){ m.appendChild(el('div','mhead',esc(r.head))); return; }
    const d=el('div','mrow','<span>'+esc(r.l)+'</span>'+(r.k?'<kbd>'+r.k+'</kbd>':''));
    d.onclick=()=>{ hideContext(); r.a&&r.a(); }; m.appendChild(d);
  });
  m.style.left=Math.min(x,innerWidth-200)+'px'; m.style.top=Math.min(y,innerHeight-260)+'px'; m.classList.add('on');
}

function duplicatePart(id){
  const spec=P.modelSpec.parts.find(p=>p.id===id); if(!spec)return;
  const cp=JSON.parse(JSON.stringify(spec)); cp.id=uid('pt'); cp.name=spec.name+' (copy)';
  cp.pos=[(spec.pos||[0,0,0])[0]+60,(spec.pos||[0,0,0])[1],(spec.pos||[0,0,0])[2]];
  P.modelSpec.parts.push(cp); rebuildModel(); snapshot('duplicate'); refreshAllPanels(); toast('Duplicated');
}
function deletePart(id){
  P.modelSpec.parts=P.modelSpec.parts.filter(p=>p.id!==id);
  delete P.parts[id];
  P.joints=P.joints.filter(j=>j.child!==id);
  S.sel=S.sel.filter(s=>s!==id);
  rebuildModel(); snapshot('delete'); refreshAllPanels(); toast('Deleted');
}
function annotatePart(id){
  const b=new THREE.Box3().setFromObject(PARTOBJ.get(id)); const ctr=b.getCenter(new THREE.Vector3());
  P.annotations.push({id:uid('ann'),type:'callout',partId:id,pos:ctr.toArray(),
    text:P.parts[id].name+' · '+(P.parts[id].partNo||''),color:'#f59e0b'});
  rebuildAnnotations(); snapshot('annotate'); refreshAllPanels();
}

/* ---------- modal ---------- */
function openModal(title,bodyNode,footerBtns,wide){
  const bg=$('#modalbg'), m=$('#modal');
  m.className='modal'+(wide?' wide':''); m.innerHTML='';
  const h=el('div','mh','<b>'+esc(title)+'</b><div class="x">&times;</div>');
  const b=el('div','mb'); b.appendChild(bodyNode);
  const f=el('div','mf');
  (footerBtns||[{l:'Close',a:closeModal}]).forEach(x=>{ const btn=el('button','btn '+(x.cls||''),esc(x.l)); btn.onclick=x.a; f.appendChild(btn); });
  m.append(h,b,f); bg.classList.add('on');
  h.querySelector('.x').onclick=closeModal;
}
function closeModal(){ $('#modalbg').classList.remove('on'); }
function promptModal(title,val,cb){
  const b=el('div'); const i=el('input'); i.type='text'; i.value=val; i.style.width='100%';
  b.appendChild(i);
  openModal(title,b,[{l:'Cancel',a:closeModal},{l:'OK',cls:'pri',a:()=>{ closeModal(); cb(i.value); }}]);

}

function multiProperties(c){
  const f=F(); f.head('MULTI-SELECTION',S.sel.length+' parts');
  f.sel('Material','',['— keep —',...Object.keys(MATLIB).map(k=>({v:k,t:MATLIB[k].label}))],v=>{
    if(v==='— keep —')return; S.sel.forEach(id=>applyMaterial(id,v)); snapshot('material'); });
  f.btns([
    {l:'Hide',i:'eyeoff',a:()=>setVisible(S.sel,false)},
    {l:'Isolate',i:'crosshair',a:()=>isolate(S.sel)},
    {l:'Explode group',i:'layers',a:()=>{ S.sel.forEach((id,i)=>{ P.parts[id].explode.order=i+1; }); snapshot('explode order'); }},

function applyMaterial(id,key){
  const d=P.parts[id]; if(!d)return; d.material=key;
  const g=PARTOBJ.get(id); if(!g)return;
  g.traverse(o=>{ if(o.isMesh){ const m=getMaterial(key); o.material=m; o.userData._mat=m; o.userData._hi=null;
    o.userData.baseMat={transparent:m.transparent,opacity:m.opacity}; }});
  if(S.sel.includes(id)) setEmissive(id,'#22d3ee',0.55);
  RESET();
}
function partProperties(c,id){
  const d=P.parts[id], g=PARTOBJ.get(id); if(!d){c.appendChild(el('div','empty','No part'));return;}
  const f=F();
  f.head('PART · '+d.name.toUpperCase());
  f.text('Name',d.name,v=>{d.name=v; refreshTree(); snapshot('rename');});
  f.text('Part number',d.partNo||'',v=>d.partNo=v);
  f.info('ID',id);
  f.sel('Parent',d.parent||'assembly',['assembly','sub-assembly','fixture'],v=>d.parent=v);
  f.chk('Visible',d.visible!==false,v=>setVisible([id],v));
  f.sel('Material',d.material,Object.keys(MATLIB).map(k=>({v:k,t:MATLIB[k].label})),v=>{applyMaterial(id,v); snapshot('material');});
  f.num('Mass (kg)',d.mass||0,v=>d.mass=v,0.01);
  if(g){
    const b=new THREE.Box3().setFromObject(g), s=b.getSize(new THREE.Vector3());
    f.head('GEOMETRY');
    f.info('Bounding X',fmt(s.x,1)+' mm'); f.info('Bounding Y',fmt(s.y,1)+' mm'); f.info('Bounding Z',fmt(s.z,1)+' mm');
    f.head('TRANSFORM (rest)');
    const rest=g.userData.rest;
    f.vec('Position',[rest.p.x,rest.p.y,rest.p.z],v=>{ rest.p.set(v[0],v[1],v[2]);
      const sp=P.modelSpec.parts.find(p=>p.id===id); if(sp)sp.pos=[...v]; solve(); RESET(); });
  }
  f.head('EXPLODE');
  const ex=d.explode||(d.explode={dir:[0,1,0],dist:120,order:1});
  f.vec('Direction',ex.dir,v=>{ex.dir=v; solve(); RESET();});
  f.range('Distance',ex.dist,0,500,5,v=>{ex.dist=v; solve(); RESET();},'mm');
  f.num('Sequence order',ex.order||1,v=>ex.order=v,1);
  f.head('LINKED');
  const jn=P.joints.filter(j=>j.child===id);
  f.info('Joints',jn.length?jn.map(j=>j.type).join(', '):'none');
  f.btns([
    {l:'Add joint',i:'node',a:()=>{addJoint(id); S.activePane.R='mech'; buildDocks();}},
    {l:'Annotate',i:'anno',a:()=>annotatePart(id)},
    {l:'Zoom to part',i:'crosshair',a:()=>{ const b=new THREE.Box3().setFromObject(g), ctr=b.getCenter(new THREE.Vector3());
      const {d:dd}=frameBox(b,1.9);
      moveCamera(ctr.clone().add(camera.position.clone().sub(controls.target).normalize().multiplyScalar(dd)),ctr,0.6); }},
    {l:'Delete',i:'trash',cls:'dgr',a:()=>deletePart(id)},
  ]);
  c.appendChild(f.el);
}

const JOINT_TYPES=['fixed','revolute','prismatic','cylindrical','spherical','planar','slider',
  'rack-pinion','gear','worm','screw','universal','hinge','linear','rotary'];
function addJoint(childId){
  const j={id:uid('j'),name:(P.parts[childId]?.name||'Part')+' joint',parent:'housing',child:childId,
    type:'revolute',axis:[1,0,0],driver:'steerAngle',ratio:1,offset:0,min:-100000,max:100000,speed:1,accel:0,unit:'deg'};
  P.joints.push(j); S.mechSel=j.id; snapshot('add joint'); solve(); refreshAllPanels();
  log('Joint added on '+(P.parts[childId]?.name||childId),'ok');
  return j;
}
PANE_RENDER.mech=function(c){
  const f=F();
  f.head('MECHANISM BUILDER',P.joints.length+' joints');
  f.list(P.joints.map(j=>({label:j.name,sub:j.type,badge:(j._val!=null?fmt(j._val,1)+' '+j.unit:''),
    badgeCls:'b-am',sel:S.mechSel===j.id,icon:'node',click:()=>{S.mechSel=j.id; refreshPane('R');}})),
    {del:it=>{ P.joints=P.joints.filter(j=>j.name!==it.label); snapshot('del joint'); solve(); refreshAllPanels(); }});
  f.btns([{l:'New joint',i:'plus',a:()=>{ if(!S.sel.length){toast('Select a part first');return;} addJoint(S.sel[0]); }},
          {l:'Graph editor',i:'node',a:()=>{ S.activePane.B='graphedit'; S.graphView='mechanism'; buildDocks(); }}]);
  const j=P.joints.find(x=>x.id===S.mechSel);
  if(j){
    f.head('JOINT DEFINITION');
    f.text('Name',j.name,v=>{j.name=v; refreshPane('R');});
    f.sel('Parent part',j.parent,['world',...Object.keys(P.parts).map(k=>({v:k,t:P.parts[k].name}))],v=>j.parent=v);
    f.sel('Child part',j.child,Object.keys(P.parts).map(k=>({v:k,t:P.parts[k].name})),v=>{j.child=v; solve();});
    f.sel('Joint type',j.type,JOINT_TYPES,v=>{ j.type=v; j.unit=(v==='prismatic'||v==='slider'||v==='linear')?'mm':'deg'; solve(); refreshPane('R'); });
    f.vec('Axis',j.axis,v=>{j.axis=v; solve();});
    f.sel('Input driver',j.driver,Object.values(P.parameters).map(p=>({v:p.id,t:p.name})),v=>{j.driver=v; solve();});
    f.num('Ratio',j.ratio,v=>{j.ratio=v; solve();},0.001);
    f.num('Offset',j.offset,v=>{j.offset=v; solve();},0.1);
    f.num('Min limit',j.min,v=>{j.min=v; solve();},1);
    f.num('Max limit',j.max,v=>{j.max=v; solve();},1);
    f.range('Motion speed',j.speed,0.1,5,0.1,v=>j.speed=v,'x');
    f.range('Acceleration',j.accel||0,0,5,0.1,v=>j.accel=v,'x');
    f.info('Current value',fmt(j._val||0,2)+' '+j.unit);
    f.note('Output = clamp(driver × ratio + offset, min, max). Chain joints by driving them from a solver parameter such as Piston Displacement or Sector Shaft Angle.');
  }
  f.head('MOTION DRIVER');
  f.range('Steering wheel angle',pv('steerAngle'),-720,720,1,v=>setParam('steerAngle',v),'deg');
  f.range('Road load torque',pv('loadTorque'),0,3000,10,v=>setParam('loadTorque',v),'N·m');
  f.info('Piston displacement',fmt(pv('pistonStroke'),2)+' mm');
  f.info('Sector shaft angle',fmt(pv('sectorAngle'),2)+' deg');
  f.info('Effective ratio',fmt(Math.abs(pv('steerAngle')/(pv('sectorAngle')||1e-6)),1)+' : 1');
  c.appendChild(f.el);
};

function addFluidFromPart(id){

function importFile(accept,cb,as){
  const inp=$('#fileIn'); inp.accept=accept; inp.value='';
  inp.onchange=()=>{ const f=inp.files[0]; if(!f)return;
    const r=new FileReader();
    r.onload=()=>cb(f,r.result);
    if(as==='arraybuffer')r.readAsArrayBuffer(f); else if(as==='text')r.readAsText(f); else r.readAsDataURL(f); };
  inp.click();
}

function refreshTimelineBar(){ if(S.activePane.B==='timeline') refreshPane('B'); }
function applyTimeline(){
  P.animations.forEach(a=>{ if(a.enabled&&P.parameters[a.target]) setParam(a.target,sampleTrack(a,S.time),true); });
  solve(); drawTimeline(); refreshAllPanels();

function tlX(t,w){ return 8+(t/S.duration)*(w-16); }
function tlT(x,w){ return clamp((x-8)/(w-16)*S.duration,0,S.duration); }
function drawTimeline(){
  if(!tlCanvas||!tlCanvas.isConnected)return;
  const wrap=tlCanvas.parentElement, dpr=Math.min(devicePixelRatio,2);
  const w=wrap.clientWidth, h=Math.max(120,P.animations.length*22+4*22);
  if(tlCanvas.width!==w*dpr||tlCanvas.height!==h*dpr){ tlCanvas.width=w*dpr; tlCanvas.height=h*dpr;
    tlCanvas.style.width=w+'px'; tlCanvas.style.height=h+'px'; }
  const x=tlCtx; x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
  x.fillStyle='#0a0f16'; x.fillRect(0,0,w,h);
  /* ruler */
  x.strokeStyle='#1b2837'; x.fillStyle='#4a5c70'; x.font='9px JetBrains Mono,monospace'; x.lineWidth=1;
  for(let s=0;s<=S.duration;s++){
    const px=tlX(s,w); x.beginPath(); x.moveTo(px,0); x.lineTo(px,h); x.stroke();
    if(s%2===0) x.fillText(s+'s',px+2,10);
  }
  /* animation tracks */
  P.animations.forEach((a,i)=>{
    const y=i*22, cy=y+11;
    x.fillStyle=i%2?'#0c121a':'#0b1017'; x.fillRect(0,y,w,22);
    x.strokeStyle='#131c26'; x.beginPath(); x.moveTo(0,y+22); x.lineTo(w,y+22); x.stroke();
    /* curve */
    x.strokeStyle=a.enabled?a.color:'#33465c'; x.lineWidth=1.4; x.beginPath();
    const p=P.parameters[a.target];
    for(let px=8;px<w-8;px+=3){
      const t=tlT(px,w), v=sampleTrack(a,t);
      const nv=p?(v-p.min)/Math.max(1e-6,p.max-p.min):0.5;
      const yy=y+20-nv*18;
      px===8?x.moveTo(px,yy):x.lineTo(px,yy);
    }
    x.stroke();
    a.keys.forEach(k=>{
      const px=tlX(k.t,w);
      x.fillStyle=a.enabled?a.color:'#3d5169';
      x.beginPath(); x.moveTo(px,cy-5); x.lineTo(px+5,cy); x.lineTo(px,cy+5); x.lineTo(px-5,cy); x.closePath(); x.fill();
    });
  });
  /* fixed tracks */
  const base=P.animations.length*22;
  const rows=[
    {label:'wp',color:'#22d3ee',marks:P.workingPrinciple.map((s,i)=>({t:P.workingPrinciple.slice(0,i).reduce((a,b)=>a+b.dur,0),l:String(i+1)}))},
    {label:'exp',color:'#f59e0b',marks:(P.explodedViews[0]?.steps||[]).map(s=>({t:s.t,l:''}))},
    {label:'snd',color:'#a78bfa',marks:(P.explodedViews[0]?.steps||[]).map(s=>({t:s.t+0.05,l:''}))},
    {label:'cam',color:'#34d399',marks:P.workingPrinciple.map((s,i)=>({t:P.workingPrinciple.slice(0,i).reduce((a,b)=>a+b.dur,0)+0.1,l:''}))},
  ];
  rows.forEach((r,i)=>{
    const y=base+i*22;
    x.fillStyle=i%2?'#0c121a':'#0b1017'; x.fillRect(0,y,w,22);
    r.marks.forEach(m=>{
      const px=tlX(clamp(m.t,0,S.duration),w);
      x.fillStyle=r.color; x.fillRect(px-1.5,y+5,3,12);
      if(m.l){ x.fillStyle='#7f93a8'; x.fillText(m.l,px+4,y+15); }
    });
  });
  /* playhead */
  const ph=tlX(S.time,w);
  x.strokeStyle='#f43f5e'; x.lineWidth=1.5; x.beginPath(); x.moveTo(ph,0); x.lineTo(ph,h); x.stroke();
  x.fillStyle='#f43f5e'; x.beginPath(); x.moveTo(ph-5,0); x.lineTo(ph+5,0); x.lineTo(ph,7); x.closePath(); x.fill();
  const tt=$('#tlTime'); if(tt)tt.textContent=fmt(S.time,2)+' / '+fmt(S.duration,1)+' s';
}
function bindTimelineMouse(){
  const cv=tlCanvas; let scrub=false;
  const hitKey=(mx,my)=>{
    const w=cv.clientWidth, i=Math.floor(my/22);
    const a=P.animations[i]; if(!a)return null;
    for(const k of a.keys){ if(Math.abs(tlX(k.t,w)-mx)<7) return {a,k}; }
    return null;
  };
  cv.onpointerdown=e=>{
    const r=cv.getBoundingClientRect(), mx=e.clientX-r.left, my=e.clientY-r.top;
    const hk=hitKey(mx,my);
    if(hk){ tlDragKey=hk; S.animSel=hk.a.id; cv.setPointerCapture(e.pointerId); return; }
    scrub=true; S.time=tlT(mx,cv.clientWidth); applyTimeline(); cv.setPointerCapture(e.pointerId);
  };
  cv.onpointermove=e=>{
    const r=cv.getBoundingClientRect(), mx=e.clientX-r.left;
    if(tlDragKey){ tlDragKey.k.t=tlT(mx,cv.clientWidth); drawTimeline(); return; }
    if(scrub){ S.time=tlT(mx,cv.clientWidth); applyTimeline(); }
  };
  cv.onpointerup=()=>{ if(tlDragKey){ tlDragKey.a.keys.sort((a,b)=>a.t-b.t); snapshot('move key'); } tlDragKey=null; scrub=false; };
  cv.ondblclick=e=>{
    const r=cv.getBoundingClientRect(), my=e.clientY-r.top, mx=e.clientX-r.left;
    const a=P.animations[Math.floor(my/22)]; if(!a)return;
    const p=P.parameters[a.target];
    a.keys.push({t:tlT(mx,cv.clientWidth),v:p?p.value:0}); a.keys.sort((x,y)=>x.t-y.t);
    snapshot('add key'); drawTimeline(); log('Keyframe added on '+a.name,'ok');
  };
  cv.oncontextmenu=e=>{
    e.preventDefault();
    const r=cv.getBoundingClientRect(), my=e.clientY-r.top, mx=e.clientX-r.left;
    const a=P.animations[Math.floor(my/22)]; if(!a)return;
    const w=cv.clientWidth;
    const k=a.keys.find(k=>Math.abs(tlX(k.t,w)-mx)<7);
    showContext(e.clientX,e.clientY,[
      {head:a.name},
      k?{l:'Delete keyframe',a:()=>{ a.keys=a.keys.filter(x=>x!==k); snapshot('del key'); drawTimeline(); }}:{l:'Add keyframe here',a:()=>{
        const p=P.parameters[a.target]; a.keys.push({t:tlT(mx,w),v:p?p.value:0}); a.keys.sort((x,y)=>x.t-y.t); drawTimeline(); }},
      {l:a.enabled?'Disable track':'Enable track',a:()=>{a.enabled=!a.enabled; refreshPane('B');}},
      {l:'Delete track',a:()=>{ P.animations=P.animations.filter(x=>x!==a); snapshot('del track'); refreshPane('B'); }},
    ]);
  };
}
function addKeyAtPlayhead(){
  const a=P.animations.find(x=>x.id===S.animSel)||P.animations[0]; if(!a){toast('No track');return;}
  const p=P.parameters[a.target];

const P_GRAPHPOS={};
function graphData(){
  if(S.graphView==='mechanism'){
    const nodes=[{id:'drv',title:'INPUT',label:'Steering wheel angle',val:()=>fmt(pv('steerAngle'),1)+'°',cls:''}];
    P.joints.forEach(j=>nodes.push({id:j.id,title:j.type.toUpperCase(),label:P.parts[j.child]?.name||j.child,
      val:()=>fmt(j._val||0,2)+' '+j.unit,cls:''}));
    const links=P.joints.map(j=>[ (j.driver==='steerAngle'?'drv':(P.joints.find(k=>k.driver===j.driver&&k.id!==j.id)?.id||'drv')), j.id]);
    return {nodes,links};
  }
  if(S.graphView==='fluid'){
    const nodes=[{id:'res',title:'SOURCE',label:'Reservoir',val:()=>fmt(pv('oilTemp'),0)+'°C',cls:'t-fluid'},
      {id:'pump',title:'PUMP',label:'Vane pump',val:()=>fmt(pv('pumpFlow'),1)+' L/min',cls:'t-fluid'},
      {id:'valve',title:'VALVE',label:'Rotary control valve',val:()=>fmt(pv('pressure'),0)+' bar',cls:'t-fluid'},
      {id:'cyl',title:'ACTUATOR',label:'Power cylinder',val:()=>fmt(pv('pistonForce'),1)+' kN',cls:'t-fluid'},
      {id:'ret',title:'RETURN',label:'Return line',val:()=>fmt(pv('flowRate'),1)+' L/min',cls:'t-fluid'}];
    return {nodes,links:[['res','pump'],['pump','valve'],['valve','cyl'],['cyl','ret'],['ret','res']]};
  }
  if(S.graphView==='signal'){
    const sg=P.signalSystems.find(s=>s.id===S.sigSel)||P.signalSystems[0];
    if(!sg)return{nodes:[],links:[]};
    return {nodes:sg.nodes.map(n=>({id:n.id,title:n.kind.toUpperCase(),label:n.name,
      val:()=>n.param?fmt(pv(n.param),1):'—',cls:'t-signal'})),links:sg.links};
  }
  const nodes=(P.logic||[]).map(r=>({id:r.id,title:'IF / THEN',label:r.name,
    val:()=>fmt(pv(r.cond.param),1)+' '+r.cond.op+' '+r.cond.value,cls:'t-logic'}));
  return {nodes,links:[]};
}
function buildGraph(wrap,svg){
  const {nodes,links}=graphData();
  const key=S.graphView;
  P_GRAPHPOS[key]=P_GRAPHPOS[key]||{};
  const pos=P_GRAPHPOS[key];
  nodes.forEach((n,i)=>{ if(!pos[n.id]) pos[n.id]={x:24+ (i%4)*180, y:24+Math.floor(i/4)*96}; });
  const nodeEls={};
  nodes.forEach(n=>{
    const d=el('div','gnode '+(n.cls||''));
    d.style.left=pos[n.id].x+'px'; d.style.top=pos[n.id].y+'px';
    d.innerHTML='<div class="gh"><span>'+esc(n.title)+'</span></div><div class="gb">'+esc(n.label)+
      '<div class="gv" data-v="'+n.id+'">'+esc(n.val())+'</div></div>'+
      '<div class="gport i"></div><div class="gport o"></div>';
    wrap.appendChild(d); nodeEls[n.id]=d;
    let dg=null;
    d.onpointerdown=e=>{ if(e.target.classList.contains('gport'))return;
      dg={x:e.clientX-d.offsetLeft,y:e.clientY-d.offsetTop}; d.setPointerCapture(e.pointerId);
      $$('.gnode',wrap).forEach(x=>x.classList.remove('sel')); d.classList.add('sel'); };
    d.onpointermove=e=>{ if(!dg)return;
      const nx=Math.max(0,e.clientX-dg.x), ny=Math.max(0,e.clientY-dg.y);
      d.style.left=nx+'px'; d.style.top=ny+'px'; pos[n.id]={x:nx,y:ny}; drawLinks(); };
    d.onpointerup=()=>dg=null;
  });
  function drawLinks(){
    svg.innerHTML='';
    links.forEach(([a,b])=>{
      const A=nodeEls[a],B=nodeEls[b]; if(!A||!B)return;
      const x1=A.offsetLeft+A.offsetWidth, y1=A.offsetTop+A.offsetHeight/2;
      const x2=B.offsetLeft, y2=B.offsetTop+B.offsetHeight/2;
      const p=document.createElementNS('http://www.w3.org/2000/svg','path');
      const dx=Math.max(30,Math.abs(x2-x1)*0.5);
      p.setAttribute('d','M'+x1+' '+y1+' C'+(x1+dx)+' '+y1+','+(x2-dx)+' '+y2+','+x2+' '+y2);
      p.setAttribute('fill','none');
      p.setAttribute('stroke',S.graphView==='fluid'?'#f59e0b':S.graphView==='signal'?'#a78bfa':'#22d3ee');
      p.setAttribute('stroke-width','1.6'); p.setAttribute('opacity','0.7');
      p.setAttribute('stroke-dasharray','7 5');
      const an=document.createElementNS('http://www.w3.org/2000/svg','animate');
      an.setAttribute('attributeName','stroke-dashoffset'); an.setAttribute('from','24'); an.setAttribute('to','0');
      an.setAttribute('dur','0.9s'); an.setAttribute('repeatCount','indefinite');
      p.appendChild(an); svg.appendChild(p);
    });
  }
  drawLinks();
  wrap._updateVals=()=>{ nodes.forEach(n=>{ const v=wrap.querySelector('[data-v="'+n.id+'"]'); if(v)v.textContent=n.val(); }); };
}
function updateGraphValues(){

  if(w&&w._updateVals)w._updateVals();
}
