PANE_RENDER.charts=function(c){
  const grid=el('div'); grid.style.cssText='display:grid;grid-template-columns:1fr 1fr;gap:6px;padding:6px;height:100%';
  const defs=[
    {t:'Pressure vs Time',x:'t',y:'pressure',c:'#f59e0b',u:'bar'},
    {t:'Flow vs Time',x:'t',y:'flow',c:'#22d3ee',u:'L/min'},
    {t:'Sector angle vs Steering angle',x:'angle',y:'sector',c:'#34d399',u:'deg'},
    {t:'Piston force vs Displacement',x:'stroke',y:'force',c:'#fb923c',u:'kN'},
  ];
  defs.forEach(d=>{
    const box=el('div'); box.style.cssText='background:#0a0f16;border:1px solid var(--line);position:relative;min-height:110px';
    const cv=el('canvas'); cv.style.cssText='width:100%;height:100%;display:block';
    const lab=el('div'); lab.style.cssText='position:absolute;top:4px;left:7px;font-family:var(--f-mono);font-size:9.5px;color:'+d.c+';letter-spacing:1px';
    lab.textContent=d.t.toUpperCase();
    box.append(cv,lab); grid.appendChild(box); cv._def=d;
  });
  c.appendChild(grid);
  drawCharts();

function drawCharts(){
  const pane=paneEl('B','charts'); if(!pane||S.activePane.B!=='charts')return;
  $$('canvas',pane).forEach(cv=>{
    const d=cv._def; if(!d)return;
    const dpr=Math.min(devicePixelRatio,2), w=cv.clientWidth, h=cv.clientHeight;
    if(cv.width!==w*dpr){cv.width=w*dpr;cv.height=h*dpr;}
    const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
    const X=BUF[d.x],Y=BUF[d.y]; if(!X||X.length<2)return;
    const xmin=Math.min(...X),xmax=Math.max(...X),ymin=Math.min(...Y,0),ymax=Math.max(...Y,1);
    x.strokeStyle='#152131'; x.lineWidth=1;
    for(let i=0;i<=4;i++){ const yy=6+i*(h-18)/4; x.beginPath(); x.moveTo(28,yy); x.lineTo(w-6,yy); x.stroke(); }
    x.fillStyle='#4a5c70'; x.font='8px JetBrains Mono,monospace';
    x.fillText(fmt(ymax,1),2,12); x.fillText(fmt(ymin,1),2,h-8);
    x.strokeStyle=d.c; x.lineWidth=1.5; x.beginPath();
    for(let i=0;i<X.length;i++){
      const px=28+((X[i]-xmin)/Math.max(1e-6,xmax-xmin))*(w-36);
      const py=h-12-((Y[i]-ymin)/Math.max(1e-6,ymax-ymin))*(h-24);
      i?x.lineTo(px,py):x.moveTo(px,py);
    }
    x.stroke();
    x.fillStyle=d.c; x.globalAlpha=0.12; x.lineTo(w-6,h-12); x.lineTo(28,h-12); x.fill(); x.globalAlpha=1;
  });
}

      const d=el('div','mrow','<span>'+esc(r.l)+'</span>'+(r.k?'<kbd>'+r.k+'</kbd>':''));
      d.onclick=e=>{ e.stopPropagation(); host.querySelectorAll('.mi').forEach(x=>x.classList.remove('open')); r.a&&r.a(); buildRibbon(); };
      pop.appendChild(d);
    });
    mi.appendChild(pop);
    mi.onclick=e=>{ e.stopPropagation(); const open=mi.classList.contains('open');
      host.querySelectorAll('.mi').forEach(x=>x.classList.remove('open')); if(!open)mi.classList.add('open'); };
    mi.onmouseenter=()=>{ if(host.querySelector('.mi.open')){ host.querySelectorAll('.mi').forEach(x=>x.classList.remove('open')); mi.classList.add('open'); } };
    host.appendChild(mi);

function renderPageDesigner(){
  const pg=currentPage(); if(!pg)return;
  const stage=$('#pdStage'), wrap=$('#pdWrap');
  const preview=wrap.classList.contains('preview');
  stage.innerHTML='';
  stage.classList.toggle('grid',!preview);
  const w=pg.w,h=pg.h;
  stage.style.width=w+'px'; stage.style.height=h+'px'; stage.style.background=preview?'transparent':pg.bg;
  const frame=preview?({desktop:1e4,tablet:834,mobile:414}[S.pdDevice]||1e4):1e4;
  const avail=Math.min(wrap.clientWidth-28,frame);
  const scale=Math.min(1,avail/w);
  stage.style.transform='scale('+scale+')'; stage.style.transformOrigin='top center';
  stage.style.marginBottom=(h*scale-h+20)+'px';
  pg.widgets.forEach(wd=>{
    const node=renderWidget(wd,{live:preview,page:pg,device:preview?S.pdDevice:'desktop',stageW:w});
    node.dataset.wid=wd.id;
    if(!preview){
      node.classList.toggle('sel',S.pdSel===wd.id);
      node.appendChild(el('div','rs'));

function bindDesignerDrag(node,wd){
  let mode=null,st=null;
  node.onpointerdown=e=>{
    e.stopPropagation();
    S.pdSel=wd.id; $$('#pdStage .wdg').forEach(n=>n.classList.remove('sel')); node.classList.add('sel');
    buildProperties();
    const scale=parseFloat($('#pdStage').style.transform.replace(/[^0-9.]/g,''))||1;
    mode=e.target.classList.contains('rs')?'resize':'move';
    st={x:e.clientX,y:e.clientY,wx:wd.x,wy:wd.y,ww:wd.w,wh:wd.h,scale};
    node.setPointerCapture(e.pointerId);
  };
  node.onpointermove=e=>{
    if(!mode)return;
    const dx=(e.clientX-st.x)/st.scale, dy=(e.clientY-st.y)/st.scale;
    if(mode==='move'){ wd.x=Math.round((st.wx+dx)/2)*2; wd.y=Math.round((st.wy+dy)/2)*2;
      node.style.left=wd.x+'px'; node.style.top=wd.y+'px'; }
    else { wd.w=Math.max(20,Math.round(st.ww+dx)); wd.h=Math.max(12,Math.round(st.wh+dy));
      node.style.width=wd.w+'px'; node.style.height=wd.h+'px'; }
  };
  node.onpointerup=()=>{ if(mode){ snapshot('move widget'); buildProperties(); } mode=null; };
  node.oncontextmenu=e=>{
    e.preventDefault();
    showContext(e.clientX,e.clientY,[
      {head:wd.type},
      {l:'Bring to front',a:()=>{ const pg=currentPage(); pg.widgets=pg.widgets.filter(x=>x!==wd); pg.widgets.push(wd); renderPageDesigner(); }},
      {l:'Send to back',a:()=>{ const pg=currentPage(); pg.widgets=pg.widgets.filter(x=>x!==wd); pg.widgets.unshift(wd); renderPageDesigner(); }},
      {l:'Duplicate',a:()=>{ const pg=currentPage(); const c=JSON.parse(JSON.stringify(wd)); c.id=uid('w'); c.x+=16; c.y+=16;
        pg.widgets.push(c); S.pdSel=c.id; snapshot('dup widget'); renderPageDesigner(); }},
      {l:'Delete',a:()=>{ const pg=currentPage(); pg.widgets=pg.widgets.filter(x=>x!==wd); S.pdSel=null;
        snapshot('del widget'); renderPageDesigner(); buildProperties(); }},
    ]);
  };
}

/* ---------- widget renderer (shared with exported runtime) ---------- */
function renderWidget(wd,ctx){
  const p=wd.props||{}, live=ctx&&ctx.live;
  const d=document.createElement('div');
  d.className='wdg';
  d.style.cssText='left:'+wd.x+'px;top:'+wd.y+'px;width:'+wd.w+'px;height:'+wd.h+'px;';
  if(p.visible===false&&live) d.style.display='none';
  const bindAttr=b=>{ if(b)d.dataset.bind=b; };
  const P_=(typeof P!=='undefined')?P:window.PROJECT;
  const par=id=>P_.parameters[id];
  switch(wd.type){
    case 'heading': d.className+=' w-label w-h1'; d.style.fontSize=(p.size||17)+'px'; d.style.color=p.color||'#eaf6ff';
      d.textContent=p.text||'Heading'; break;
    case 'label': case 'text': {
      d.className+=' w-label'; d.style.fontSize=(p.size||12)+'px'; d.style.color=p.color||'#c8d6e5';
      if(p.mono){ d.style.fontFamily="'JetBrains Mono',monospace"; d.style.letterSpacing='1.2px'; }
      if(wd.type==='text'){ d.style.display='block'; d.style.lineHeight='1.5'; }
      d.textContent=p.text||''; break; }
    case 'separator': d.style.borderTop='1px solid #1e2a3a'; break;
    case 'panel': case 'subgrid': case 'drawArea':
      d.className+=' w-panel'; d.style.background=p.bg||'#0f151e'; d.style.borderColor=p.border||'#1e2a3a'; break;
    case 'card': d.className+=' w-card';
      d.innerHTML='<div style="font-size:12px;color:#22d3ee;letter-spacing:1px">'+esc(p.title||'Information')+
        '</div><div style="font-size:11.5px;color:#93a8bd;line-height:1.5;margin-top:4px">'+esc(p.text||'')+'</div>'; break;
    case 'callout': d.className+=' w-callout'; d.textContent=p.text||''; break;
    case 'button': {
      const b=document.createElement('button');
      b.className='w-btn'+(p.accent?' act':''); b.textContent=p.text||'Action';
      if(live) b.onclick=()=>{ widgetAction(wd); };
      else b.style.pointerEvents='none';
      d.appendChild(b); break; }
    case 'checkbox': {
      const wrap=document.createElement('label');
      wrap.style.cssText='display:flex;align-items:center;gap:7px;font-size:12px;color:#c8d6e5;height:100%;cursor:pointer';
      const i=document.createElement('input'); i.type='checkbox';
      i.checked=p.bind?!!par(p.bind)?.value:false;
      if(live) i.onchange=()=>{ setParam(p.bind,i.checked?1:0); };
      else i.style.pointerEvents='none';
      wrap.append(i,document.createTextNode(p.label||p.bind||'Option'));
      d.appendChild(wrap); bindAttr(p.bind); break; }
    case 'radio': {
      d.style.fontSize='12px'; d.style.color='#c8d6e5';
      const opts=(p.options||'A,B').split(',');
      const nm=uid('r');
      opts.forEach(o=>{
        const l=document.createElement('label'); l.style.cssText='display:flex;gap:6px;align-items:center;padding:2px 0;cursor:pointer';
        const i=document.createElement('input'); i.type='radio'; i.name=nm;
        if(live) i.onchange=()=>widgetAction(wd,o.trim().toLowerCase());
        l.append(i,document.createTextNode(o.trim())); d.appendChild(l);
      }); break; }
    case 'slider': {
      d.className+=' w-slider';
      const pr=p.bind?par(p.bind):null;
      const top=document.createElement('div'); top.className='sl-top';
      top.innerHTML='<span>'+esc(p.label||(pr?pr.name:'Parameter'))+'</span><b data-val="'+(p.bind||'')+'">'+

        (pr?fmt(pr.value,1)+' '+pr.unit:'')+'</b></div><div class="pb"><i style="width:'+(k*100)+'%"></i></div>';
      bindAttr(p.bind); d.dataset.max=p.max||''; break; }
    case 'led': {

      const pr=p.bind?par(p.bind):null, on=pr?(pr.type==='bool'?pr.value:pr.value>(p.threshold||0)):false;

function updateWidgetBindings(){
  const stage=$('#pdStage'); if(!stage)return;
  $$('[data-val]',stage).forEach(n=>{
    const id=n.dataset.val; const pr=P.parameters[id]; if(!pr)return;
    const unit=n.querySelector('span');
    n.textContent=fmt(pr.value,Math.abs(pr.value)<10?2:1)+(unit?'':' '+(pr.unit||''));
    if(unit)n.appendChild(unit);
  });
  $$('.w-prog',stage).forEach(n=>{
    const id=n.dataset.bind, pr=P.parameters[id]; if(!pr)return;
    const mx=n.dataset.max?(P.parameters[n.dataset.max]?.value||pr.max):pr.max;
    const bar=n.querySelector('.pb i'); if(bar)bar.style.width=clamp(pr.value/Math.max(mx,1e-6),0,1)*100+'%';
  });
  $$('.w-led',stage).forEach(n=>{
    const pr=P.parameters[n.dataset.bind]; if(!pr)return;
    const on=pr.type==='bool'?pr.value:pr.value>(+n.dataset.thr||0);
    const i=n.querySelector('i'); if(i)i.className=on?'on':'';
  });
  $$('[data-role="steps"] .st',stage).forEach((n,i)=>n.classList.toggle('on',i===WP.idx));
  const tf=stage.querySelector('[data-role="tlfill"]'); if(tf)tf.style.width=(S.time/S.duration*100)+'%';
  $$('[data-role="chart"]',stage).forEach(n=>drawMiniChart(n));
}
function drawMiniChart(node){
  const cv=node.querySelector('canvas'); if(!cv)return;
  const key=node.dataset.bind==='flowRate'?'flow':node.dataset.bind==='pistonForce'?'force':'pressure';
  const data=BUF[key]||[]; if(data.length<2)return;
  const dpr=Math.min(devicePixelRatio,2), w=cv.clientWidth, h=cv.clientHeight;
  if(cv.width!==w*dpr){ cv.width=w*dpr; cv.height=h*dpr; }
  const x=cv.getContext('2d'); x.setTransform(dpr,0,0,dpr,0,0); x.clearRect(0,0,w,h);
  const mx=Math.max(...data,1), mn=Math.min(...data,0);
  x.strokeStyle='#22d3ee'; x.lineWidth=1.4; x.beginPath();
  data.forEach((v,i)=>{ const px=i/(data.length-1)*w, py=h-4-((v-mn)/Math.max(1e-6,mx-mn))*(h-10);
    i?x.lineTo(px,py):x.moveTo(px,py); });
  x.stroke();
  x.fillStyle='rgba(34,211,238,.12)'; x.lineTo(w,h); x.lineTo(0,h); x.fill();
  x.fillStyle='#6b7f96'; x.font='9px JetBrains Mono,monospace';
  x.fillText((node.dataset.bind||'').toUpperCase(),4,10);
}

function registerImported(obj,name){
  const id=uid('imp');
  obj.name=name; obj.userData.partId=id;
  obj.traverse(o=>{ if(o.isMesh){ o.userData.partId=id; o.castShadow=o.receiveShadow=true;
    if(!o.material||!o.material.isMeshPhysicalMaterial) o.material=getMaterial('steel');
    o.userData.baseMat={transparent:false,opacity:1}; }});
  const box=new THREE.Box3().setFromObject(obj), size=box.getSize(new THREE.Vector3());
  const mx=Math.max(size.x,size.y,size.z);
  if(mx>0&&(mx<20||mx>2000)){ const s=200/mx; obj.scale.setScalar(s); log('Imported model scaled ×'+fmt(s,3),'w'); }
  obj.userData.rest={p:obj.position.clone(),q:obj.quaternion.clone()};
  root.add(obj); PARTOBJ.set(id,obj);
  P.parts[id]={id,name,partNo:'IMPORTED',material:'steel',visible:true,mass:0,parent:'assembly',
    explode:{dir:[0,1,0],dist:150,order:1}};
  P.imported.push({id,name,format:'mesh'});
  IMPORTED_OBJ.set(id,obj);
  modelBounds.setFromObject(root); updateStats(); snapshot('import'); refreshAllPanels(); fitAll();
  log('Imported '+name,'ok'); toast('Imported '+name);
}
function loadGLTF(file,buf){
  const l=new GLTFLoader();
  try{ const draco=new DRACOLoader(); draco.setDecoderPath('./vendor/three/examples/jsm/libs/draco/'); l.setDRACOLoader(draco); }catch(e){}
  l.parse(buf,'',g=>registerImported(g.scene,file.name),e=>log('GLTF parse failed: '+e.message,'e'));
}
function loadOBJ(file,text){
  try{ registerImported(new OBJLoader().parse(text),file.name); }catch(e){ log('OBJ parse failed','e'); }
}
function loadSTL(file,buf){
  try{ const g=new STLLoader().parse(buf); g.computeVertexNormals();
    registerImported(new THREE.Mesh(g,getMaterial('steel')),file.name); }catch(e){ log('STL parse failed','e'); }
}
function exportGLB(){
  status('Exporting GLB…',true);
  new GLTFExporter().parse(root,r=>{
    dl(P.meta.name.replace(/\s+/g,'_')+'.glb',new Blob([r],{type:'model/gltf-binary'}));
    status('Ready'); log('GLB exported','ok');
  },e=>{log('GLB export failed','e'); status('Ready');},{binary:true});
}

  const ctx=SND.ctx,t=ctx.currentTime,vol=def.vol||0.35;
  const env=(g,a,d)=>{g.gain.setValueAtTime(0.0001,t); g.gain.exponentialRampToValueAtTime(vol,t+a);
    g.gain.exponentialRampToValueAtTime(0.0001,t+a+d);};
  const noise=(f,q,a,d)=>{const s=ctx.createBufferSource(); s.buffer=SND.noise;
    const bp=ctx.createBiquadFilter(); bp.type='bandpass'; bp.frequency.value=f; bp.Q.value=q;
    const g=ctx.createGain(); s.connect(bp); bp.connect(g); g.connect(SND.master); env(g,a,d); s.start(t); s.stop(t+a+d+0.05);};
  const tone=(f,f2,a,d,ty='sine')=>{const o=ctx.createOscillator(); o.type=ty; o.frequency.setValueAtTime(f,t);
    if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+a+d);
    const g=ctx.createGain(); o.connect(g); g.connect(SND.master); env(g,a,d); o.start(t); o.stop(t+a+d+0.05);};
  switch(def.synth||id){
    case 'click': noise(2600,6,0.002,0.05); break;
    case 'clunk': tone(160,60,0.004,0.28,'square'); noise(400,1.4,0.004,0.16); break;
    case 'slide': noise(900,0.8,0.06,0.5); break;
    case 'balls': for(let i=0;i<7;i++)setTimeout(()=>noise(3000+Math.random()*1800,8,0.002,0.04),i*45); break;
    case 'relief': noise(1400,1,0.02,0.5); tone(700,240,0.02,0.4,'sawtooth'); break;
    case 'servo': tone(230,520,0.05,0.22,'sawtooth'); break;
    case 'beep': case 'warn': tone(880,880,0.01,0.14,'square'); break;
    default: noise(1200,2,0.01,0.2);
  }
}
function updateAudio(){
  if(!SND.ctx)return; const t=SND.ctx.currentTime;
  const flow=clamp(pv('flowRate')/12,0,1), pump=pv('pumpOn')?1:0;
  SND.engines.hum.gain.gain.setTargetAtTime(pump*0.22*(0.6+0.4*flow),t,0.15);
  SND.engines.hum.osc.frequency.setTargetAtTime(88+flow*46,t,0.2);
  SND.engines.hiss.gain.gain.setTargetAtTime(flow*0.26,t,0.12);
  SND.engines.hiss.filter.frequency.setTargetAtTime(1500+pv('pressure')*8,t,0.2);
}
function pushBuffers(time){
  BUF.t.push(time); BUF.pressure.push(pv('pressure')); BUF.flow.push(pv('flowRate'));
  BUF.force.push(pv('pistonForce')); BUF.angle.push(pv('steerAngle'));
  BUF.sector.push(pv('sectorAngle')); BUF.stroke.push(pv('pistonStroke'));
  if(BUF.t.length>300)Object.values(BUF).forEach(a=>a.shift());
}
let _acc=0,_bufT=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05); _bufT+=dt;
  updateCam(dt); updateTw(dt); controls.update();
  if(S.playing){ S.time+=dt*S.speed; if(S.time>S.duration)S.time=S.loop?0:S.duration;
    (P.animations||[]).forEach(a=>{ if(a.enabled&&P.parameters[a.target]) setParam(a.target,sampleTrack(a,S.time)); }); }
  if(WP.playing){ WP.t+=dt; const st=P.workingPrinciple[WP.idx];
    if(st&&WP.t>=st.dur){ if(WP.idx<P.workingPrinciple.length-1)wpGoto(WP.idx+1); else WP.playing=false; } }
  solve(dt);
  updateFluids(dt,performance.now()/1000);
  updateAudio();
  if(_bufT>0.08){ pushBuffers(performance.now()/1000); _bufT=0; }
  updateWidgetBindings();
  renderer.render(scene,camera);
}
/* build fluids after scene exists */
function boot(){ init(); rebuildFluids(); }
window.RT={action:(t,tg,v)=>runAction({type:t,target:tg,value:v}),view:setView,fit:fitAll,
  play:v=>S.playing=v,reset:resetSimulation,explode:v=>animateParam('explode',v,1.6),wp:wpGoto};
addEventListener('pointerdown',()=>audioInit(),{once:true});
boot();
`;

function buildVpToolbar(){
  const tb=$('#vptb'); tb.innerHTML='';
  const items=[
    {i:'rot',t:'Rotate / select',a:()=>setTool('select'),on:()=>S.tool==='select'},
    {i:'pan',t:'Pan',a:()=>setTool('pan'),on:()=>S.tool==='pan'},
    {i:'fit',t:'Fit all',a:fitAll},
    {i:'iso',t:'Isometric',a:()=>setView('iso')},
    {i:'sec',t:'Section',a:()=>{SECT.on=!SECT.on; updateClipping(); syncVpToolbar(); updateHUD();},on:()=>SECT.on},
    {i:'clip',t:'Clip axis',a:()=>{SECT.axis=({x:'y',y:'z',z:'x'})[SECT.axis]; updateClipping(); updateHUD();}},
    {i:'meas',t:'Measure',a:toggleMeasure,on:()=>MEAS.active},
    {i:'layers',t:'Explode',a:()=>animateParam('explode',pv('explode')>0.5?0:1,1.6)},
    {i:'mat',t:'X-Ray',a:()=>applyDisplayMode(P.render.mode==='xray'?'shaded':'xray'),on:()=>P.render.mode==='xray'},
    {i:'grid',t:'Wireframe',a:()=>applyDisplayMode(P.render.mode==='wireframe'?'shaded':'wireframe'),on:()=>P.render.mode==='wireframe'},
    {i:'shot',t:'Screenshot',a:()=>saveScreenshot()},
    {i:'ui',t:'Page designer',a:()=>$('#pdWrap').classList.contains('on')?closePageDesigner():openPageDesigner(),
      on:()=>$('#pdWrap').classList.contains('on')},
    {i:'eye',t:'Preview',a:enterPreview},
    {i:'full',t:'Fullscreen',a:toggleFullscreen},
  ];
  items.forEach(it=>{ const b=el('div','vtb'+(it.on&&it.on()?' on':''),ico(it.i)); b.title=it.t;
    b.onclick=()=>{it.a(); syncVpToolbar();}; tb.appendChild(b); });
}
function syncVpToolbar(){ buildVpToolbar(); }
function bindViewport(){
  const dom=renderer.domElement;
  let down=null;
  dom.addEventListener('pointerdown',e=>{ down={x:e.clientX,y:e.clientY,t:performance.now()}; });
  dom.addEventListener('pointerup',e=>{
    if(!down)return;
    const moved=Math.hypot(e.clientX-down.x,e.clientY-down.y);
    down=null;
    if(moved>4||e.button!==0)return;
    const hit=pickAt(e.clientX,e.clientY);
    if(MEAS.active){ measureClick(hit); return; }
    if(!hit){ selectParts([]); return; }
    selectParts([hit.object.userData.partId],e.shiftKey||e.ctrlKey);
    const id=hit.object.userData.partId;
    (P.events||[]).forEach(ev=>{ if(ev.on==='onClick'&&ev.source===id) ev.actions.forEach(runAction); });
  });
  dom.addEventListener('pointermove',e=>{
    if(!P.settings.hoverHighlight)return;
    if(controls.enabled&&e.buttons)return;
    const hit=pickAt(e.clientX,e.clientY);
    hoverPart(hit?hit.object.userData.partId:null);
    dom.style.cursor=hit?'pointer':(MEAS.active?'crosshair':'default');
  });
  dom.addEventListener('dblclick',e=>{
    const hit=pickAt(e.clientX,e.clientY); if(!hit)return;
    const g=PARTOBJ.get(hit.object.userData.partId);
    const b=new THREE.Box3().setFromObject(g), c=b.getCenter(new THREE.Vector3()), {d}=frameBox(b,2.0);
    moveCamera(c.clone().add(camera.position.clone().sub(controls.target).normalize().multiplyScalar(d)),c,0.6);
  });
  dom.addEventListener('contextmenu',e=>{
    e.preventDefault();
    const hit=pickAt(e.clientX,e.clientY);
    if(hit){ const id=hit.object.userData.partId; if(!S.sel.includes(id))selectParts([id]);
      showContext(e.clientX,e.clientY,partContextMenu(id)); }
    else showContext(e.clientX,e.clientY,[
      {head:'Viewport'},{l:'Fit all',a:fitAll},{l:'Isometric',a:()=>setView('iso')},
      {l:'Show all',a:showAll},{l:'Section on/off',a:()=>{SECT.on=!SECT.on;updateClipping();}},
      {l:'Render still',a:()=>saveScreenshot(true)},{l:'Render settings',a:()=>{S.activePane.R='render';buildDocks();}}]);
  });
}
function bindSplitters(){
  const drag=(handle,fn)=>{
    handle.onpointerdown=e=>{ e.preventDefault(); handle.setPointerCapture(e.pointerId);
      const move=ev=>fn(ev); const up=()=>{ handle.onpointermove=null; handle.onpointerup=null; resizeViewport(); };
      handle.onpointermove=move; handle.onpointerup=up; };
  };
  drag($('#splitL'),e=>{ $('#dockL').style.flexBasis=clamp(e.clientX,120,560)+'px'; resizeViewport(); });
  drag($('#splitR'),e=>{ $('#dockR').style.flexBasis=clamp(innerWidth-e.clientX,150,620)+'px'; resizeViewport(); });
  drag($('#splitB'),e=>{ const r=$('#ws').getBoundingClientRect();
    $('#dockB').style.flexBasis=clamp(r.bottom-e.clientY,26,r.height-160)+'px'; resizeViewport(); });
}
function bindKeys(){
  addEventListener('keydown',e=>{
    if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;
    const k=e.key.toLowerCase();
    if(e.ctrlKey||e.metaKey){
      if(k==='z'){e.preventDefault(); undo();} else if(k==='y'){e.preventDefault(); redo();}
      else if(k==='s'){e.preventDefault(); saveProject();} else if(k==='o'){e.preventDefault(); openProjectFile();}
      else if(k==='n'){e.preventDefault(); newProjectDialog();}
      return;
    }
    switch(k){
      case ' ': e.preventDefault(); S.playing=!S.playing; audioInit(); refreshTimelineBar(); break;
      case 'f': fitAll(); break;
      case '1': setView('front'); break; case '2': setView('back'); break;
      case '3': setView('left'); break; case '4': setView('right'); break;
      case '5': setView('top'); break; case '6': setView('bottom'); break; case '7': setView('iso'); break;
      case 'h': setVisible(S.sel,false); break;
      case 'i': if(S.sel.length)isolate(S.sel); break;
      case 'a': showAll(); break;
      case 'e': animateParam('explode',pv('explode')>0.5?0:1,1.6); break;
      case 'm': toggleMeasure(); break;
      case 's': SECT.on=!SECT.on; updateClipping(); syncVpToolbar(); break;
      case 'k': addKeyAtPlayhead(); break;
      case 'p': $('#pdWrap').classList.contains('on')?closePageDesigner():openPageDesigner(); break;
      case 'delete': case 'backspace': if(S.sel[0])deletePart(S.sel[0]); break;
      case 'escape': if(S.preview)exitPreview(); else selectParts([]); hideContext(); closeModal(); break;
    }
  });
  addEventListener('click',e=>{ if(!$('#ctx').contains(e.target))hideContext();
    if(!$('#menubar').contains(e.target)) $$('#menus .mi').forEach(m=>m.classList.remove('open')); });
  $('#exitPreview').onclick=exitPreview;
  $$('#previewBar [data-prev]').forEach(b=>b.onclick=()=>setPreviewDevice(b.dataset.prev));
}

function bootstrapProject(withTemplate=true){
  P=newProject();
  P.modelSpec=withTemplate?buildRCBSpec({}):{name:'Empty assembly',params:{bore:82,stroke:54,ratio:20.4,lead:12},parts:[],anchors:{}};
  P.parameters=defaultParameters();
  P.parts={};
  rebuildModel();
  P.joints=withTemplate?defaultJoints():[];
  P.explodedViews=withTemplate?defaultExplodedViews():[];
  P.fluidSystems=withTemplate?defaultFluids():[];
  P.signalSystems=withTemplate?defaultSignals():[];
  P.sounds=defaultSounds();
  P.workingPrinciple=withTemplate?defaultWorkingPrinciple():[];
  P.animations=withTemplate?defaultAnimations():[];
  P.events=defaultEvents();
  P.logic=defaultLogic();
  P.cameras=[{id:uid('cm'),name:'Isometric',p:[430,300,470],t:[0,35,0]},
             {id:uid('cm'),name:'Valve detail',p:[330,120,220],t:[190,10,0]},
             {id:uid('cm'),name:'Sector output',p:[120,-120,330],t:[0,-90,60]}];
  P.pages=[defaultPage()];
  S.pageSel=P.pages[0].id;
  rebuildFluids(); rebuildSignals(); rebuildAnnotations();
  applyEnvironment(P.render.env);
  solve(); fitAll();
  HIST.stack=[]; HIST.ptr=-1; snapshot('new project');
  refreshAllPanels(); buildVpToolbar();
  log('Project initialised · '+P.meta.name,'ok');
}
let _fpsT=0,_fpsN=0,_lastHud=0,_chartT=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=Math.min(clock.getDelta(),0.05);
  updateCameraTween(dt); updateTweens(dt); controls.update();
  updateTimeline(dt); updateWP(dt);
  solve(dt);
  updateFluids(dt,performance.now()/1000);
  updateSignals(dt);
  updateSoundEngines();
  renderFrame(dt);
  renderViewCube();
  updateAnnotationScreen();
  _chartT+=dt;
  if(_chartT>0.09){ pushBuffers(performance.now()/1000); _chartT=0;
    if(S.activePane.B==='charts')drawCharts();
    if(S.activePane.B==='graphedit')updateGraphValues();
    if($('#pdWrap').classList.contains('on'))updateWidgetBindings();
  }
  _fpsN++; _fpsT+=dt;
  if(_fpsT>0.5){ S.fps=Math.round(_fpsN/_fpsT); $('#stFps').textContent=S.fps; _fpsN=0; _fpsT=0;
    if(performance.now()-_lastHud>400){ updateHUD(); _lastHud=performance.now(); } }
}
function main(){
  initViewport(); initViewCube();
  bootstrapProject(true);
  buildMenus(); buildRibbon(); buildDocks(); buildVpToolbar();
  bindViewport(); bindSplitters(); bindKeys();
  setView('iso',true);

  setInterval(()=>{ if(P.settings.autosave){ try{ localStorage.setItem('ecpd_autosave',JSON.stringify(serializeProject())); }catch(e){} } },45000);
  window.__ECPD_OK=true;
}
